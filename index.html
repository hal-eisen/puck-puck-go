<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Puck Puck Go</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#123c34">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --inset-l: env(safe-area-inset-left, 0px); --inset-r: env(safe-area-inset-right, 0px);
    --inset-t: env(safe-area-inset-top, 0px);   --inset-b: env(safe-area-inset-bottom, 0px);
  }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    overflow: hidden; overscroll-behavior: none;
    background: #0d2b26; color: #eef6f2;
    font: 500 clamp(14px, 2.2vmin, 22px)/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #stage { position: fixed; inset: 0; display: block; touch-action: none; }
  .overlay {
    position: fixed; inset: 0; display: none; place-items: center;
    background: rgba(6, 22, 19, .82); z-index: 10; text-align: center; padding: 6vmin;
  }
  .overlay.on { display: grid; }
  .overlay h1 { font-size: clamp(26px, 7vmin, 72px); margin: 0 0 .3em; letter-spacing: .01em; }
  .overlay p { font-size: clamp(15px, 3vmin, 26px); margin: 0 0 1.4em; opacity: .9; }
  .btn {
    font: inherit; font-size: clamp(18px, 4vmin, 34px); font-weight: 700;
    padding: .5em 1.4em; border: 0; border-radius: .6em; background: #f2c14e; color: #17130b;
    cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none;
  }
  .btn:active { transform: translateY(1px) scale(.99); }
  #debug {
    position: fixed; left: 8px; top: 8px; z-index: 20; display: none;
    background: rgba(0,0,0,.62); color: #d8f5e8; font: 11px/1.5 ui-monospace, Menlo, Consolas, monospace;
    padding: 8px 10px; border-radius: 8px; max-width: 46vmin; max-height: 92vh; overflow: auto;
    touch-action: pan-y;
  }
  #debug.on { display: block; }
  #debug label { display: grid; grid-template-columns: 1fr 4.5em; gap: 6px; align-items: center; }
  #debug h3 { margin: 6px 0 3px; font-size: 11px; text-transform: uppercase; opacity: .7; }
  #debug pre { margin: 4px 0; white-space: pre-wrap; }
  #debug button { font: inherit; margin: 2px 4px 2px 0; }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div class="overlay" id="rotate">
  <div><h1 id="orientTitle">Too small to play</h1><p id="orientMsg">Turn the tablet, or make the window bigger.</p></div>
</div>

<div class="overlay" id="winner">
  <div>
    <h1 id="winnerTitle">Blue wins</h1>
    <p id="winnerScore">5 – 3</p>
    <button class="btn" id="rematch">Rematch</button>
  </div>
</div>

<div id="debug"></div>

<script>
"use strict";
/* =====================================================================================
   PUCK PUCK GO — one self-contained file. Offline. No dependencies, no build step.
   Load order is the module system: each section uses only sections above it.
   GAME emits events; BOOT fans them out to RENDER/AUDIO. Nothing else cross-calls.
   Non-goals (v1): no AI, no network, no trajectory prediction/aim assist, no turn timers,
   no haptics, no settings, no persistence. Do not add device-orientation input: the table
   is top-down by design regardless of how the tablet is mounted in the car.
   ===================================================================================== */

/* ============================== SECTION: CONFIG ============================== */
const CONFIG = {
  PHYSICS: {
    step: 1 / 120, maxSubSteps: 8, maxTravel: 0.02,     // base step, CCD bound (H / sub-step)
    halfW: 0.80, halfH: 0.50, cornerR: 0.12,            // field interior, rounded corners
    mouthHalf: 0.15, goalDepth: 0.08,                   // goal mouth half-width, pocket depth
    stoneR: 0.045, puckR: 0.035, stoneMass: 1.0, puckMass: 0.6,
    restitution: { stoneStone: 0.92, stonePuck: 0.92, wall: 0.75 },
    restitutionSpeedMin: 0.2,                           // below this: no bounce (kills micro-jitter)
    // Tuned against T25: on an empty board a max-power stone must roll ~ONE field length.
    // 3.0 H/s rolled 2.73 H = 171% of the table, so every full pull slammed the far wall.
    maxLaunchSpeed: 2.15, rollingDecel: 0.9, linearDamping: 0.4,
    restThreshold: 0.01, settleConsecutive: 2, settleCap: 12.0, hardSpeedMax: 6.0,
    iterations: 4, posIterations: 5, slop: 0.0005, correction: 0.4,
    nudgeGap: 0.035, nudgeDuration: 0.15, scoreMargin: 0.01,
  },
  AIM: {
    maxDragFraction: 0.25,                              // max drag = 0.25 x field height (CSS px)
    deadZonePx: 6, grabTolerancePx: 12, grabToleranceRatio: 0.35,
    angleStepDeg: 0.05, powerStep: 0.004,               // determinism lattice
  },
  GAME: { winScore: 5, bannerMs: 1000, celebrationMs: 2000 },
  RENDER: { marginPx: 8, particleCap: 60, dprMax: 3,
    hudBand: { frac: 0.10, min: 34, max: 72 },              // score strip, along whichever axis has slack
    layout: 'auto',                 // which way the table's LONG axis points: 'auto' | 'wide' | 'tall'
    minStonePx: 18,                 // a stone's DIAMETER below this is not playable, in any layout
    flipMargin: 1.06,               // 'tall' must draw a board 6% bigger to win: no flapping on resize
    colors: {
    p1: '#3d8cff', p1dim: '#1d4f9c', p2: '#ff8a3d', p2dim: '#a4501c',
    felt: '#16473e', feltEdge: '#0f352e', line: '#2f6b5f', puck: '#f4f7f4', puckRing: '#1c2b26' } },
  AUDIO: { pairThrottleMs: 50, maxVoices: 8 },
  LAYOUT: { p1: [[-0.65, -0.15], [-0.65, 0.15], [-0.50, 0], [-0.35, -0.15], [-0.35, 0.15]], puck: [0, 0] },
};
const P = CONFIG.PHYSICS;

/* ?layout=wide|tall|auto has to be read BEFORE the first fit(), which is why it lives here and
   not in DEBUG: it is also the escape hatch for a seat we cannot sense. A portrait centre
   display in a car has both players alongside it, and for that seat the right answer is the
   smaller 'wide' board, not the bigger 'tall' one. Override costs one constant. */
const LAYOUT_PARAM = (new URLSearchParams(location.search).get('layout') || '').trim();
if (LAYOUT_PARAM === 'wide' || LAYOUT_PARAM === 'tall' || LAYOUT_PARAM === 'auto') CONFIG.RENDER.layout = LAYOUT_PARAM;

/* ============================== SECTION: GEOMETRY ============================== */
/* The boundary is a signed-distance field, evaluated per body class:
     stones: the rounded box only  => the goal mouth is SOLID WALL
     puck:   rounded box UNION two goal pockets => the mouth is an OPENING
   "Stones never enter a goal" is therefore structural, not something to test for. */
const GEOM = (() => {
  const pocketCx = P.halfW + P.goalDepth / 2, pocketHx = P.goalDepth / 2;
  function sdBox(x, y, hx, hy) {
    const ax = Math.max(Math.abs(x) - hx, 0), ay = Math.max(Math.abs(y) - hy, 0);
    return Math.sqrt(ax * ax + ay * ay) + Math.min(Math.max(Math.abs(x) - hx, Math.abs(y) - hy), 0);
  }
  function sdField(x, y) {
    const ox = Math.abs(x) - P.halfW + P.cornerR, oy = Math.abs(y) - P.halfH + P.cornerR;
    const ax = Math.max(ox, 0), ay = Math.max(oy, 0);
    return Math.sqrt(ax * ax + ay * ay) + Math.min(Math.max(ox, oy), 0) - P.cornerR;
  }
  // A *neck* box straddles each goal line, reaching from deep inside the field to the back of
  // the pocket. Without it, min(sdField, sdPocket) under-reports clearance at the mouth plane
  // and the puck bounces off an imaginary wall 1 puck radius short of the opening: the neck
  // makes the goal line stop being a wall exactly where the mouth is, while sdField keeps the
  // posts solid and the end wall solid outside |y| <= mouthHalf.
  const neckLen = 0.30;
  const neckCx = P.halfW + P.goalDepth / 2, neckHx = P.goalDepth / 2 + neckLen / 2;
  const sdMouthR = (x, y) => sdBox(x - neckCx, y, neckHx, P.mouthHalf);
  const sdMouthL = (x, y) => sdBox(x + neckCx, y, neckHx, P.mouthHalf);
  const sdStones = (x, y) => sdField(x, y);                 // mouth is SOLID for stones
  const sdPuck = (x, y) => Math.min(sdField(x, y), sdMouthR(x, y), sdMouthL(x, y));
  // numeric gradient of an SDF = outward (increasing-d) unit normal; deterministic arithmetic
  function grad(f, x, y) {
    const e = 1e-5, gx = f(x + e, y) - f(x - e, y), gy = f(x, y + e) - f(x, y - e);
    const l = Math.sqrt(gx * gx + gy * gy);
    return l > 0 ? { x: gx / l, y: gy / l } : { x: 0, y: 0 };
  }
  const inPocket = (x) => Math.abs(x) > P.halfW;
  const scoreLine = P.halfW + P.puckR;                  // puck center crosses => fully crossed
  const LAYOUT = {
    p1: CONFIG.LAYOUT.p1.map(([x, y]) => ({ x, y })),
    p2: CONFIG.LAYOUT.p1.map(([x, y]) => ({ x: -x, y })),
    puck: { x: CONFIG.LAYOUT.puck[0], y: CONFIG.LAYOUT.puck[1] },
  };
  const DRAW = { minX: -(P.halfW + P.goalDepth), maxX: P.halfW + P.goalDepth, minY: -P.halfH, maxY: P.halfH };
  return { sdField, sdStones, sdPuck, grad, inPocket, scoreLine, LAYOUT, DRAW, pocketCx, pocketHx };
})();

/* ============================== SECTION: SOLVER ============================== */
/* 11 circles, no rotation, zero inter-body friction => every contact is a 1-D impulse
   along one normal. n always points from A toward the other collider (or into the wall). */
const SOLVER = {
  detect(world, out) {
    const bs = world.bodies;
    for (let i = 0; i < bs.length; i++) {
      const a = bs[i];
      const sd = a.type === 'puck' ? GEOM.sdPuck : GEOM.sdStones;
      const d = sd(a.x, a.y);
      if (d > -a.r) {                                   // surface is inside the wall
        const g = GEOM.grad(sd, a.x, a.y);
        out.push({ a, b: null, nx: g.x, ny: g.y, depth: d + a.r, e: P.restitution.wall, wall: true });
      }
      for (let j = i + 1; j < bs.length; j++) {
        const b = bs[j], dx = b.x - a.x, dy = b.y - a.y;
        const d2 = dx * dx + dy * dy, rr = a.r + b.r;
        if (d2 < rr * rr && d2 > 0) {
          const dist = Math.sqrt(d2), inv = 1 / dist;
          const kind = (a.type === 'puck' || b.type === 'puck') ? 'stonePuck' : 'stoneStone';
          out.push({ a, b, nx: dx * inv, ny: dy * inv, depth: rr - dist, e: P.restitution[kind] });
        }
      }
    }
  },

  solveVel(world, contacts) {
    for (let it = 0; it < P.iterations; it++) {
      for (const c of contacts) {
        const A = c.a, B = c.b;
        const rvx = (B ? B.vx : 0) - A.vx, rvy = (B ? B.vy : 0) - A.vy;
        const vn = rvx * c.nx + rvy * c.ny;
        if (vn >= 0) continue;                          // separating
        const approach = -vn;
        const e = approach > P.restitutionSpeedMin ? c.e : 0;
        const imSum = A.im + (B ? B.im : 0);
        const j = -(1 + e) * vn / imSum;
        A.vx -= c.nx * j * A.im; A.vy -= c.ny * j * A.im;
        if (B) { B.vx += c.nx * j * B.im; B.vy += c.ny * j * B.im; }
        if (it === 0 && approach > 0.08) world.emit(A, B, approach, c.wall);
      }
    }
  },

  solvePos(world, contacts) {
    const bs = world.bodies;
    for (let it = 0; it < P.posIterations; it++) {
      for (const c of contacts) {
        const A = c.a, B = c.b;
        if (B) {
          const dx = B.x - A.x, dy = B.y - A.y;
          const dist = Math.sqrt(dx * dx + dy * dy) || 1e-9, rr = A.r + B.r;
          const pen = rr - dist; if (pen <= P.slop) continue;
          const nx = dx / dist, ny = dy / dist;
          const k = Math.max(pen - P.slop, 0) * P.correction / (A.im + B.im);
          A.x -= nx * k * A.im; A.y -= ny * k * A.im;
          B.x += nx * k * B.im; B.y += ny * k * B.im;
        } else {
          const sd = A.type === 'puck' ? GEOM.sdPuck : GEOM.sdStones;
          const d = sd(A.x, A.y); if (d > -A.r + P.slop) continue;
          const g = GEOM.grad(sd, A.x, A.y);
          const pen = (d + A.r - P.slop) * P.correction;
          A.x -= g.x * pen; A.y -= g.y * pen;
        }
      }
    }
    // Hard invariant: no body may be left inside a wall. This is what guarantees stones
    // can never be found in a goal, whatever the iterative solver did.
    for (let pass = 0; pass < 3; pass++) {
      for (const b of bs) {
        const sd = b.type === 'puck' ? GEOM.sdPuck : GEOM.sdStones;
        const d = sd(b.x, b.y);
        if (d > -b.r) { const g = GEOM.grad(sd, b.x, b.y); b.x -= g.x * (d + b.r); b.y -= g.y * (d + b.r); }
      }
    }
  },

  // exact solution of dv/dt = -a - k*v, so the tuning table in the design doc is exactly
  // what the code computes (and sub-stepping cannot perturb settle behaviour)
  integrate(world, h) {
    const a = P.rollingDecel, k = P.linearDamping;
    for (const b of world.bodies) {
      const sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
      if (sp <= 0) { b.resting = true; continue; }
      let ns, dx;
      if (k > 1e-9) {
        const shift = a / k;
        ns = (sp + shift) * Math.exp(-k * h) - shift;
        if (ns < 0) ns = 0;
        dx = (sp - ns) / k - shift * h;
      } else if (a > 1e-9) {
        ns = Math.max(0, sp - a * h); dx = (sp * sp - ns * ns) / (2 * a);
      } else { ns = sp; dx = sp * h; }
      if (ns < P.restThreshold) { ns = 0; dx = 0; }
      const cap = sp * h; if (dx > cap) dx = cap; if (dx < 0) dx = 0;
      const inv = 1 / sp;
      b.x += b.vx * inv * dx; b.y += b.vy * inv * dx;
      if (ns === 0) { b.vx = 0; b.vy = 0; b.resting = true; }
      else { b.vx *= ns / sp; b.vy *= ns / sp; b.resting = false; }
      if (b.vx !== b.vx || b.vy !== b.vy) { b.vx = 0; b.vy = 0; }
    }
  },
};

/* ============================== SECTION: SIM ============================== */
/* The entire engine boundary. GAME/INPUT/RENDER may not touch physics internals.
   Swapping in another engine (see design doc D1) means replacing SOLVER + SIM only. */
const SIM = {
  create(cfg = P) {
    const w = {
      bodies: [], stones: [], puck: null, cfg,
      goal: null, events: [], violations: [], turnTime: 0, totalSteps: 0, subStepHits: 0,
      emit(a, b, speed, wall) { w.events.push({ a: a.id, b: b ? b.id : -1, speed, wall: !!wall, kind: b === null ? 'wall' : (a.type === 'puck' || b.type === 'puck') ? 'puck' : 'stone' }); },
    };
    let id = 0;
    function add(type, owner, x, y) {
      const r = type === 'puck' ? cfg.puckR : cfg.stoneR;
      const m = type === 'puck' ? cfg.puckMass : cfg.stoneMass;
      const b = { id: id++, type, owner, x, y, vx: 0, vy: 0, r, im: 1 / m, resting: true };
      w.bodies.push(b); if (type === 'puck') w.puck = b; else w.stones.push(b);
      return b;
    }
    function reset() {
      w.bodies.length = 0; w.stones.length = 0; w.puck = null; w.goal = null;
      w.events.length = 0; w.turnTime = 0; id = 0;
      for (const s of GEOM.LAYOUT.p1) add('stone', 1, s.x, s.y);
      for (const s of GEOM.LAYOUT.p2) add('stone', 2, s.x, s.y);
      add('puck', 0, GEOM.LAYOUT.puck.x, GEOM.LAYOUT.puck.y);
    }
    reset();

    function subStep(h) {
      SOLVER.integrate(w, h);
      const contacts = [];
      SOLVER.detect(w, contacts);
      SOLVER.solveVel(w, contacts);
      SOLVER.solvePos(w, contacts);
      for (const b of w.bodies) {
        const sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
        if (sp > cfg.hardSpeedMax) { const k = cfg.hardSpeedMax / sp; b.vx *= k; b.vy *= k; }
        if (sp < cfg.restThreshold) { b.vx = 0; b.vy = 0; b.resting = true; }
        check(b);
      }
    }
    function check(b) {
      if (!(typeof DEBUG_FLAGS !== 'undefined' && DEBUG_FLAGS.check)) return;
      const sd = b.type === 'puck' ? GEOM.sdPuck : GEOM.sdStones;
      const d = sd(b.x, b.y);
      if (d > -b.r + 1e-7) w.violations.push({ id: b.id, x: b.x, y: b.y, vx: b.vx, vy: b.vy, d: d + b.r });
      if (b.type === 'stone' && Math.abs(b.x) > cfg.halfW + 1e-7)
        w.violations.push({ id: b.id, x: b.x, y: b.y, vx: b.vx, vy: b.vy, d: Math.abs(b.x) - cfg.halfW });
    }

    function step(dt = cfg.step) {
      if (w.goal) return;
      let vmax = 0;
      for (const b of w.bodies) { const s = Math.abs(b.vx) + Math.abs(b.vy); if (s > vmax) vmax = s; }
      let n = Math.ceil((2 * vmax * dt) / cfg.maxTravel);
      n = n < 1 ? 1 : (n > cfg.maxSubSteps ? cfg.maxSubSteps : n);
      if (n > 1) w.subStepHits++;
      for (let i = 0; i < n; i++) subStep(dt / n);
      w.totalSteps++;
      w.turnTime += dt;
      // scoring: region test, evaluated before any rescue from contact handling
      const px = w.puck.x;
      if (px >= GEOM.scoreLine) w.goal = { scorer: 1, conceder: 2, side: 'right', x: px };
      else if (px <= -GEOM.scoreLine) w.goal = { scorer: 2, conceder: 1, side: 'left', x: px };
      if (w.turnTime > cfg.settleCap && !allAtRest()) {
        w.timedOut = true;
        for (const b of w.bodies) { b.vx = 0; b.vy = 0; b.resting = true; }
      }
    }
    function allAtRest() { for (const b of w.bodies) if (!b.resting) return false; return true; }

    // PRD rule 8: a puck at rest against an OUTER wall/corner eases clear.
    // Kinematic (never an impulse), puck-only, and clamped so it can never cause a goal.
    function nudgeTarget() {
      const p = w.puck;
      if (GEOM.inPocket(p.x)) return null;               // hanging pucks are live, not nudged
      const d = GEOM.sdField(p.x, p.y);
      const clearance = -d - p.r;
      if (clearance >= cfg.nudgeGap) return null;
      const g = GEOM.grad(GEOM.sdField, p.x, p.y);
      const move = (cfg.nudgeGap - clearance) + 0.002;
      let tx = p.x - g.x * move, ty = p.y - g.y * move;
      const limit = GEOM.scoreLine - cfg.scoreMargin;
      if (tx > limit) tx = limit; if (tx < -limit) tx = -limit;
      const dd = GEOM.sdField(tx, ty);
      if (dd > -p.r) { const g2 = GEOM.grad(GEOM.sdField, tx, ty); tx -= g2.x * (dd + p.r); ty -= g2.y * (dd + p.r); }
      return { x: tx, y: ty };
    }
    function relaxAgainstBodies(puck) {
      for (let it = 0; it < 20; it++) {
        let moved = false;
        for (const b of w.bodies) {
          if (b === puck) continue;
          const dx = puck.x - b.x, dy = puck.y - b.y, rr = puck.r + b.r;
          const d2 = dx * dx + dy * dy;
          if (d2 < rr * rr) {
            const dist = Math.sqrt(d2) || 1e-9, push = (rr - dist) / dist;
            puck.x += dx * push; puck.y += dy * push; moved = true;
          }
        }
        const d = GEOM.sdField(puck.x, puck.y);
        if (d > -puck.r) { const g = GEOM.grad(GEOM.sdField, puck.x, puck.y); puck.x -= g.x * (d + puck.r); puck.y -= g.y * (d + puck.r); moved = true; }
        if (!moved) break;
      }
    }

    return {
      world: w, reset, step, allAtRest, subStep, nudgeTarget, relaxAgainstBodies,
      fire(body, angle, speed) {
        body.vx = Math.cos(angle) * speed; body.vy = Math.sin(angle) * speed;
        body.resting = false; w.turnTime = 0; w.timedOut = false;
      },
      stoneAt(x, y, rPx) {
        let best = null, bd = Infinity;
        for (const s of w.stones) {
          const dx = s.x - x, dy = s.y - y, d = Math.sqrt(dx * dx + dy * dy);
          if (d <= rPx && d < bd) { best = s; bd = d; }
        }
        return best;
      },
      maxSpeed() { let m = 0; for (const b of w.bodies) { const s = Math.hypot(b.vx, b.vy); if (s > m) m = s; } return m; },
      kinetic() { let e = 0; for (const b of w.bodies) e += 0.5 * (1 / b.im) * (b.vx * b.vx + b.vy * b.vy); return e; },
    };
  },
};
/* ============================== SECTION: PRNG ============================== */
function mulberry32(seed) {
  let t = seed >>> 0;
  return function () {
    t = (t + 0x6D2B79F5) >>> 0;
    let r = Math.imul(t ^ (t >>> 15), 1 | t);
    r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}
/* ?seed= pins the run for reproducible debugging and for the self-tests. Without it the seed
   is fresh per page load, because the PRD asks for a random first player - a constant default
   made every match start with the same player, which is not random, just predictable.
   Physics stays reproducible either way: launches are quantized from input, not from this. */
const SEED_PARAM = new URLSearchParams(location.search).get('seed');
const SEED = SEED_PARAM === null ? ((Math.random() * 0x100000000) >>> 0) : Number(SEED_PARAM);
const rand = mulberry32(SEED);

/* ============================== SECTION: GAME ============================== */
/* Rules live here and nowhere else. GAME never calls RENDER/AUDIO directly; it emits. */
const GAME = {
  sim: SIM.create(),
  state: 'Kickoff', score: [0, 0], turn: 1, startPlayer: 1,
  banner: null, goalFx: null, particles: [], nudge: null, restRun: 0,
  handlers: {},
  on(ev, fn) { (this.handlers[ev] ||= []).push(fn); },
  emit(ev, a, b, c) { for (const fn of (this.handlers[ev] || [])) fn(a, b, c); },
  get inputUnlocked() { return this.state === 'Aiming'; },

  newMatch() {
    this.score = [0, 0];
    this.startPlayer = rand() < 0.5 ? 1 : 2;
    this.turn = this.startPlayer;
    this.sim.reset();
    this.goalFx = null; this.particles = []; this.nudge = null;
    this.enter('Kickoff');
  },
  enter(s) {
    this.state = s; this.restRun = 0;
    if (s === 'Kickoff') this.banner = { player: this.turn, t: 0, ms: CONFIG.GAME.bannerMs };
    if (s === 'Settling') this.finishSettle();          // PRD rule 8 wall nudge
    this.emit('state', s);
  },
  startTurn() { this.enter('Kickoff'); },

  fire(body, angle, speed) {                       // from INPUT; already validated
    this.sim.fire(body, angle, speed);
    this.restRun = 0;
    this.emit('shot', body, angle, speed);
    this.enter('Simulating');
  },

  tick() {                                          // one fixed physics step
    if (this.state !== 'Simulating') return;
    this.sim.step();
    for (const ev of this.sim.world.events) this.emit('hit', ev);
    this.sim.world.events.length = 0;
    if (this.sim.world.goal) { this.onGoal(this.sim.world.goal); return; }
    if (this.sim.allAtRest()) {
      if (++this.restRun >= CONFIG.PHYSICS.settleConsecutive) {
        this.turn = this.turn === 1 ? 2 : 1;      // PRD: turns alternate; a goal overrides this
        this.enter('Settling');
      }
    }
    else this.restRun = 0;
  },

  onGoal(g) {
    this.score[g.scorer - 1]++;
    this.turn = g.conceder;                         // conceder takes the next shot
    this.goalFx = { t: 0, ms: CONFIG.GAME.celebrationMs, scorer: g.scorer, side: g.side };
    this.spawnParticles(g);
    this.emit('goal', g, this.score.slice());
    this.enter('Goal');
  },
  spawnParticles(g) {
    const n = Math.min(CONFIG.RENDER.particleCap, 44), side = g.side;
    for (let i = 0; i < n; i++) {
      const a = rand() * Math.PI * 2, sp = 0.25 + rand() * 1.1;
      this.particles.push({
        x: side === 'right' ? P.halfW : -P.halfW, y: (rand() - 0.5) * 0.3,
        vx: Math.cos(a) * sp * (side === 'right' ? -1 : 1), vy: Math.sin(a) * sp,
        life: 1, scorer: g.scorer,
      });
    }
  },
  finishSettle() {
    const target = this.sim.nudgeTarget();
    if (target) {
      const p = this.sim.world.puck;
      this.nudge = { from: { x: p.x, y: p.y }, to: target, t: 0, ms: CONFIG.PHYSICS.nudgeDuration * 1000 };
      this.emit('nudge', target);
    } else this.startTurn();
  },

  update(dt) {                                      // dt = real seconds since last frame
    const step = CONFIG.PHYSICS.step;
    this._acc = Math.min((this._acc || 0) + Math.min(dt, 0.1), 0.25);
    while (this._acc >= step) { this.tick(); this._acc -= step; }

    if (this.banner && (this.banner.t += dt * 1000) >= this.banner.ms) {
      this.banner = null;
      if (this.state === 'Kickoff') this.enter('Aiming');
    }
    if (this.goalFx && (this.goalFx.t += dt * 1000) >= this.goalFx.ms) {
      const won = Math.max(this.score[0], this.score[1]) >= CONFIG.GAME.winScore;
      this.goalFx = null;
      if (won) this.enter('MatchOver');
      else { this.sim.reset(); this.startTurn(); }
    }
    if (this.nudge) {
      const k = Math.min(1, (this.nudge.t += dt * 1000) / this.nudge.ms);
      const e = k * k * (3 - 2 * k), p = this.sim.world.puck;
      p.x = this.nudge.from.x + (this.nudge.to.x - this.nudge.from.x) * e;
      p.y = this.nudge.from.y + (this.nudge.to.y - this.nudge.from.y) * e;
      if (k >= 1) { this.sim.relaxAgainstBodies(p); this.nudge = null; this.startTurn(); }
    }
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const q = this.particles[i];
      q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.94; q.vy *= 0.94; q.life -= dt * 0.7;
      if (q.life <= 0) this.particles.splice(i, 1);
    }
  },

  rematch() { this.newMatch(); },
};

/* ============================== SECTION: INPUT ============================== */
/* Slingshot. One captured pointer owns an aim. A shot CANNOT fire until the pointer has
   travelled past the dead zone, so a phantom/ghost touch (capacitive noise while the tablet
   is charging from the car USB port) is inert by construction. Do not tune that away. */
const INPUT = {
  pointerId: null, body: null, px: 0, py: 0, sx: 0, sy: 0, moved: false,
  attach(canvas) {
    canvas.addEventListener('pointerdown', this.onDown.bind(this), { passive: false });
    canvas.addEventListener('pointermove', this.onMove.bind(this), { passive: false });
    canvas.addEventListener('pointerup', this.onUp.bind(this), { passive: false });
    canvas.addEventListener('pointercancel', this.onCancel.bind(this), { passive: false });
    window.addEventListener('blur', () => this.abort());
  },
  abort() { if (this.pointerId !== null) this.release(); this.body = null; },
  onDown(e) {
    PLATFORM.firstGesture();
    if (this.pointerId !== null) return;             // second finger / ghost: ignored entirely
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (!GAME.inputUnlocked) return;
    const hit = RENDER.pickStone(e.clientX, e.clientY, GAME.turn);
    if (!hit) return;                               // puck, opponent stones, empty field: nothing
    this.pointerId = e.pointerId; this.body = hit.body;
    this.px = e.clientX; this.py = e.clientY;
    this.moved = false;
    try { RENDER.canvas.setPointerCapture(e.pointerId); } catch (_) {}
    this.sample();
  },
  onMove(e) {
    if (e.pointerId !== this.pointerId) return;      // only the captured pointer, ever
    this.px = e.clientX; this.py = e.clientY; this.moved = true; this.sample();
  },
  onUp(e) {
    if (e.pointerId !== this.pointerId) return;
    this.px = e.clientX; this.py = e.clientY; this.sample();
    const aim = this.aimVector();
    this.release();
    if (aim && !aim.cancelled && aim.speed > 0) GAME.fire(this.body, aim.angle, aim.speed);
    this.body = null;
  },
  onCancel() { this.release(); this.body = null; },  // system gesture / app switch = cancel
  release() {
    if (this.pointerId !== null) { try { RENDER.canvas.releasePointerCapture(this.pointerId); } catch (_) {} }
    this.pointerId = null;
  },
  sample() { const w = RENDER.toWorld(this.px, this.py); this.sx = w.x; this.sy = w.y; },
  // direction = stone -> away from finger; power linear in drag past the dead zone, clamped
  aimVector() {
    const b = this.body; if (!b) return null;
    const st = RENDER.metrics;
    const dxw = b.x - this.sx, dyw = b.y - this.sy;
    // The pull is measured in SCREEN px against where the stone is actually DRAWN, because that
    // is the only distance a finger has; at() is the same mapping the renderer drew with, so a
    // layout change cannot desync "how far I dragged" from "what I was looking at" and the dead
    // zone stays a real floor under the phantom touches this game has to survive.
    const drawn = st.at(b.x, b.y);
    const dpx = Math.hypot(this.px - drawn.x, this.py - drawn.y);
    const dead = st.stonePx + CONFIG.AIM.deadZonePx;
    const maxDrag = CONFIG.AIM.maxDragFraction * st.fieldHpx;
    const len = Math.hypot(dxw, dyw);
    const l2 = len > 0 ? { x: dxw / len, y: dyw / len } : { x: 1, y: 0 };
    const t0 = Math.max(0, Math.min(1, (dpx - dead) / Math.max(1, maxDrag - dead)));
    const ps = CONFIG.AIM.powerStep;
    const t = Math.round(t0 / ps) * ps;
    const as = CONFIG.AIM.angleStepDeg * Math.PI / 180;
    const angle = Math.round(Math.atan2(l2.y, l2.x) / as) * as;
    return {
      dir: l2, power: t, dpx, dead, maxDrag, cancelled: dpx <= dead,
      angle, speed: t * P.maxLaunchSpeed,
    };
  },
  current() { return this.pointerId !== null && this.body ? this.aimVector() : null; },
};

/* ============================== SECTION: AUDIO ============================== */
/* Synthesized only (no audio files). Unlocked synchronously inside the first pointerdown. */
const AUDIO = {
  ctx: null, unlocked: false, last: new Map(), voices: 0, noise: null,
  unlock() {
    if (this.unlocked) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      this.ctx = new AC();
      const sr = this.ctx.sampleRate, buf = this.ctx.createBuffer(1, Math.floor(sr * 0.05), sr);
      const ch = buf.getChannelData(0);
      for (let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / ch.length);
      this.noise = buf;
      this.ctx.resume();
      const g = this.ctx.createGain(); g.gain.value = 0; g.connect(this.ctx.destination);
      const o = this.ctx.createOscillator(); o.connect(g); o.start(); o.stop(this.ctx.currentTime + 0.01);
      this.setMaster();                    // compressor bus: created with the context, always
      this.unlocked = true;
    } catch (_) { /* audio is not load-bearing */ }
  },
  ready() { return this.unlocked && this.ctx.state === 'running'; },
  hit(ev) {
    if (!this.ready() || this.voices >= CONFIG.AUDIO.maxVoices) return;
    const key = ev.a < ev.b ? ev.a + ':' + ev.b : ev.b + ':' + ev.a;
    const now = this.ctx.currentTime * 1000;
    const prev = this.last.get(key) || -1e9;
    if (now - prev < CONFIG.AUDIO.pairThrottleMs) return;
    this.last.set(key, now);
    const s = Math.max(0.02, Math.min(1, ev.speed / P.maxLaunchSpeed));
    if (ev.kind === 'wall') this.tone(noiseVoice(this.ctx, this.noise, 400 + 1800 * s), 0.10 * s + 0.02, 0.05);
    else if (ev.kind === 'puck') this.tone(oscVoice(this.ctx, 700 + 900 * s, 'triangle'), 0.16 * s + 0.03, 0.07);
    else this.tone(oscVoice(this.ctx, 300 + 700 * s, 'triangle'), 0.22 * s + 0.04, 0.11, 0.66);
  },
  tone(v, gain, dur, detune) {
    const ctx = this.ctx, g = ctx.createGain(), t = ctx.currentTime;
    g.gain.setValueAtTime(Math.min(0.5, gain), t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    if (detune) v.node.detune && (v.node.detune.value = detune * 1200);
    this.voices++;
    const self = this;
    g.connect(this.master);
    v.out.connect(g);
    v.start(t);                            // unscheduled start: stop() without start() throws
    v.stop(t + dur + 0.02);
    setTimeout(() => { self.voices--; }, (dur + 0.05) * 1000);
  },
  fanfare(kind) {
    if (!this.ready()) return;
    const seq = kind === 'goal' ? [523, 659, 784] : [523, 659, 784, 1047];
    seq.forEach((f, i) => setTimeout(() => this.tone(oscVoice(this.ctx, f, 'square'), 0.14, 0.22), i * 110));
  },
  suspend() { if (this.ready()) this.ctx.suspend(); },
  resume() { if (this.unlocked) this.ctx.resume(); },
  setMaster() {
    const comp = this.ctx.createDynamicsCompressor();
    comp.connect(this.ctx.destination); this.master = comp;
  },
};
function oscVoice(ctx, freq, type) {
  const o = ctx.createOscillator(); o.type = type; o.frequency.value = freq;
  const g = ctx.createGain(); g.gain.value = 1; o.connect(g);
  return { node: o, out: g, start: (t) => o.start(t), stop: (t) => o.stop(t) };
}
function noiseVoice(ctx, buf, cutoff) {
  const s = ctx.createBufferSource(); s.buffer = buf;
  const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff;
  s.connect(f); return { node: s, out: f, start: (t) => s.start(t), stop: (t) => s.stop(t) };
}

/* ============================== SECTION: RENDER ============================== */
const RENDER = {
  canvas: document.getElementById('stage'),
  ctx: null, dpr: 1, scale: 1, cx: 0, cy: 0, W: 0, H: 0, mx: 0, my: 0,
  stat: null, sctx: null, sprites: {}, paths: {}, t: 0,
  rot: 0, band: 0, bandTop: 0, bandLeft: 0, bandMid: 0,
  init() {
    this.ctx = this.canvas.getContext('2d');
    this.fit();
    window.addEventListener('resize', () => this.fit());
    window.addEventListener('orientationchange', () => setTimeout(() => this.fit(), 120));
    if (window.visualViewport) window.visualViewport.addEventListener('resize', () => this.fit());
  },
  fit() {
    const W = window.innerWidth, H = window.innerHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, CONFIG.RENDER.dprMax);
    const ins = safeInsets();
    const mx = CONFIG.RENDER.marginPx + ins.x, my = CONFIG.RENDER.marginPx + ins.y;
    const dw = GEOM.DRAW.maxX - GEOM.DRAW.minX, dh = GEOM.DRAW.maxY - GEOM.DRAW.minY;
    /* The same table can be laid down two ways: long axis ACROSS the screen ('wide', players at
       the left and right edges) or ALONG it ('tall', players at the bottom and top edges). Both
       are the identical game seen from a different seat, and the physics is never told which one
       was chosen - so the only honest tie-breaker available to a machine that cannot see the
       players is which way draws the BIGGER board. Bigger board = bigger stones = aimable in
       sunlight, which is the reason the PRD asked for landscape in the first place.
       The scoreboard keeps a reserved strip either way - across the top when wide, down the left
       when tall - so it is never painted on the felt in either layout (layoutProbe, T26/T27). */
    const way = (rot) => {
      const band = this.bandPx(Math.min(W, H));
      const availW = Math.max(48, W - 2 * mx - (rot ? band : 0));
      const availH = Math.max(48, H - 2 * my - (rot ? 0 : band));
      return { rot, band, availW, availH, scale: Math.min(availW / (rot ? dh : dw), availH / (rot ? dw : dh)) };
    };
    const wide = way(0), tall = way(1), policy = CONFIG.RENDER.layout;
    let pick = wide;
    if (policy === 'tall') pick = tall;
    else if (policy === 'wide') pick = wide;
    else if (tall.scale > wide.scale * CONFIG.RENDER.flipMargin) pick = tall;
    this.rot = pick.rot; this.band = pick.band; this.mx = mx; this.my = my;
    this.bandTop = my; this.bandLeft = mx;
    this.bandMid = pick.rot ? H / 2 : my + pick.band / 2;     // centre ALONG the strip's own axis
    this.W = W; this.H = H; this.dpr = dpr; this.scale = pick.scale;
    this.cx = pick.rot ? mx + pick.band + pick.availW / 2 : W / 2;
    this.cy = pick.rot ? H / 2 : my + pick.band + pick.availH / 2;
    this.canvas.width = Math.round(W * dpr); this.canvas.height = Math.round(H * dpr);
    this.canvas.style.width = W + 'px'; this.canvas.style.height = H + 'px';
    this.bakeStatic(); this.bakeSprites();
    PLATFORM.rotateCheck();
  },
  bandPx(shortSide) {
    const b = CONFIG.RENDER.hudBand;
    return Math.round(Math.max(b.min, Math.min(shortSide * b.frac, b.max)));
  },
  /* One world point in, one SCREEN css px out, in BOTH layouts. A 90-degree layout cannot be
     carried by the old one-dimensional X(x)/Y(y) pair: when the table stands up, a screen x
     depends on world y. So every draw call, every pixel probe and the entire input path go
     through pt()/toWorld()/dir(), and there is exactly one frame in this file - the one thing
     that keeps "you grab the stone you can see" true in either layout. */
  pt(x, y) {
    const ax = x * this.scale, ay = -y * this.scale;
    return this.rot ? { x: this.cx + ay, y: this.cy - ax } : { x: this.cx + ax, y: this.cy + ay };
  },
  // world -> screen, exact inverse of pt(): same rotation, opposite sign, no approximation
  toWorld(px, py) {
    return this.rot ? { x: (this.cy - py) / this.scale, y: (this.cx - px) / this.scale }
                    : { x: (px - this.cx) / this.scale, y: (this.cy - py) / this.scale };
  },
  // world direction -> screen direction (unit-preserving, no translation): the aim arrow speaks this
  dir(dx, dy) { return this.rot ? { x: -dy, y: -dx } : { x: dx, y: -dy }; },
  L(v) { return v * this.scale; },
  // world-aligned rect -> its screen box (a quarter turn keeps an axis-aligned rect axis-aligned)
  rect(x0, y0, x1, y1) {
    const a = this.pt(x0, y0), b = this.pt(x1, y1);
    return { x: Math.min(a.x, b.x), y: Math.min(a.y, b.y), w: Math.abs(b.x - a.x), h: Math.abs(b.y - a.y) };
  },
  fieldRect() { return this.rect(GEOM.DRAW.minX, GEOM.DRAW.minY, GEOM.DRAW.maxX, GEOM.DRAW.maxY); },
  bandRect() {
    return this.rot ? { x: this.bandLeft, y: this.my, w: this.band, h: this.H - 2 * this.my }
                    : { x: this.mx, y: this.bandTop, w: this.W - 2 * this.mx, h: this.band };
  },
  get metrics() {
    const self = this;
    return { at: (x, y) => self.pt(x, y), fieldHpx: 2 * P.halfH * this.scale, stonePx: P.stoneR * this.scale };
  },
  pickStone(px, py, player) {
    const r = P.stoneR * this.scale + Math.max(CONFIG.AIM.grabTolerancePx, CONFIG.AIM.grabToleranceRatio * P.stoneR * this.scale);
    let best = null, bd = Infinity;
    for (const s of GAME.sim.world.stones) {
      if (s.owner !== player) continue;
      const p = this.pt(s.x, s.y), dx = p.x - px, dy = p.y - py, d = Math.hypot(dx, dy);
      if (d <= r && d < bd) { best = { body: s, d }; bd = d; }
    }
    return best;
  },

  rr(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
    c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    c.lineTo(x + r, y + h); c.quadraticCurveTo(x, y + h, x, y + h - r);
    c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y); c.closePath();
  },
  fieldOutline(c) {                                   // rounded rect in css px
    const r = this.rect(-P.halfW, -P.halfH, P.halfW, P.halfH);
    this.rr(c, r.x, r.y, r.w, r.h, this.L(P.cornerR));
  },
  bakeStatic() {
    const c0 = this.stat || (this.stat = document.createElement('canvas'));
    c0.width = this.canvas.width; c0.height = this.canvas.height;
    const c = c0.getContext('2d');
    c.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    c.clearRect(0, 0, this.W, this.H);
    const C = CONFIG.RENDER.colors;
    // pockets first (behind felt edge), then felt, so the mouth reads as an opening
    for (const side of [-1, 1]) {
      const g = this.rect(side === 1 ? P.halfW : -(P.halfW + P.goalDepth), -P.mouthHalf,
                          side === 1 ? P.halfW + P.goalDepth : -P.halfW, P.mouthHalf);
      c.fillStyle = C.feltEdge;
      c.fillRect(g.x, g.y, g.w, g.h);
      c.strokeStyle = C.line; c.lineWidth = 1.5;
      c.strokeRect(g.x, g.y, g.w, g.h);
    }
    this.fieldOutline(c); c.fillStyle = C.felt; c.fill();
    c.save(); this.fieldOutline(c); c.clip();
    c.strokeStyle = 'rgba(255,255,255,.07)'; c.lineWidth = Math.max(2, this.L(0.02));
    const mid = this.pt(0, 0);
    c.beginPath(); c.arc(mid.x, mid.y, this.L(0.16), 0, Math.PI * 2); c.stroke();
    c.strokeStyle = 'rgba(255,255,255,.10)'; c.lineWidth = Math.max(1, this.L(0.008));
    const ln0 = this.pt(0, P.halfH), ln1 = this.pt(0, -P.halfH);
    c.beginPath(); c.moveTo(ln0.x, ln0.y); c.lineTo(ln1.x, ln1.y); c.stroke();
    c.restore();
    this.fieldOutline(c); c.strokeStyle = 'rgba(230,246,238,.30)'; c.lineWidth = 2; c.stroke();
    // thin goal line: a stone resting against the (invisible) mouth wall must read correctly
    for (const side of [-1, 1]) {
      c.strokeStyle = 'rgba(255,255,255,.22)'; c.lineWidth = 1; c.setLineDash([4, 4]);
      const q0 = this.pt(side * P.halfW, P.mouthHalf), q1 = this.pt(side * P.halfW, -P.mouthHalf);
      c.beginPath(); c.moveTo(q0.x, q0.y); c.lineTo(q1.x, q1.y); c.stroke();
      c.setLineDash([]);
    }
  },
  sprite(key, rPx, draw) {
    const pad = Math.ceil(rPx * 1.9), size = Math.ceil(2 * rPx + 2 * pad);
    const cv = document.createElement('canvas');
    cv.width = Math.ceil(size * this.dpr); cv.height = Math.ceil(size * this.dpr);
    const c = cv.getContext('2d');
    // Local (0,0) is the BODY centre, so the sprite canvas must be padded by pad+rPx on
    // each side: padding by pad alone shifts every stone and the puck by one radius, which
    // desyncs what you see from what you can grab.
    c.setTransform(this.dpr, 0, 0, this.dpr, (pad + rPx) * this.dpr, (pad + rPx) * this.dpr);
    draw(c, rPx);
    this.sprites[key] = { cv, half: size / 2 };
  },
  bakeSprites() {
    const C = CONFIG.RENDER.colors, rp = P.puckR * this.scale, rs = P.stoneR * this.scale;
    const disc = (c, r, fill, ring) => {
      const g = c.createRadialGradient(-r * .35, -r * .4, r * .1, 0, 0, r);
      g.addColorStop(0, 'rgba(255,255,255,.55)'); g.addColorStop(.45, 'rgba(255,255,255,.06)'); g.addColorStop(1, 'rgba(0,0,0,.25)');
      c.fillStyle = fill; c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.fill();
      c.fillStyle = g; c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.fill();
      c.strokeStyle = ring; c.lineWidth = Math.max(1.5, r * .12); c.beginPath(); c.arc(0, 0, r * .96, 0, Math.PI * 2); c.stroke();
    };
    this.sprite('p1', rs, (c, r) => { disc(c, r, C.p1, C.p1dim); c.fillStyle = 'rgba(255,255,255,.85)'; c.beginPath(); c.arc(0, 0, r * .26, 0, Math.PI * 2); c.fill(); });
    this.sprite('p2', rs, (c, r) => { disc(c, r, C.p2, C.p2dim); c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = Math.max(1, r * .16); c.beginPath(); c.arc(0, 0, r * .52, 0, Math.PI * 2); c.stroke(); });
    this.sprite('puck', rp, (c, r) => { disc(c, r, C.puck, C.puckRing); c.strokeStyle = C.puckRing; c.lineWidth = Math.max(1, r * .18); c.beginPath(); c.arc(0, 0, r * .55, 0, Math.PI * 2); c.stroke(); });
    for (const k of ['p1', 'p2']) {
      this.sprite('halo-' + k, rs, (c, r) => {
        const g = c.createRadialGradient(0, 0, r * 1.02, 0, 0, r * 1.9);
        g.addColorStop(0, CONFIG.RENDER.colors[k] + 'cc'); g.addColorStop(1, CONFIG.RENDER.colors[k] + '00');
        c.fillStyle = g; c.beginPath(); c.arc(0, 0, r * 1.9, 0, Math.PI * 2); c.fill();

    }
  },
  blit(key, x, y, alpha, scaleK) {
    const s = this.sprites[key]; if (!s) return;
    const c = this.ctx; c.save(); if (alpha !== undefined) c.globalAlpha = alpha;
    const w = s.cv.width / this.dpr * (scaleK || 1);
    const p = this.pt(x, y);
    c.drawImage(s.cv, p.x - w / 2, p.y - w / 2, w, w); c.restore();
  },
  halfTint(player, alpha) {
    const C = CONFIG.RENDER.colors, c = this.ctx;
    c.save(); this.fieldOutline(c); c.clip();
    c.fillStyle = C[player === 1 ? 'p1' : 'p2'];
    c.globalAlpha = alpha;
    const hf = this.rect(player === 1 ? -P.halfW : 0, -P.halfH, player === 1 ? 0 : P.halfW, P.halfH);
    c.fillRect(hf.x, hf.y, hf.w, hf.h);
    c.restore();
  },
  frame(now) {
    this.t = now / 1000;
    const c = this.ctx, C = CONFIG.RENDER.colors;
    c.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    c.fillStyle = '#0d2b26'; c.fillRect(0, 0, this.W, this.H);
    c.drawImage(this.stat, 0, 0, this.W, this.H);

    if (GAME.state === 'Aiming' || GAME.state === 'Kickoff') this.halfTint(GAME.turn, 0.07 + 0.03 * Math.sin(this.t * 2.2));
    if (GAME.goalFx) {
      const k = 1 - GAME.goalFx.t / GAME.goalFx.ms;
      this.halfTint(GAME.goalFx.scorer, 0.30 * k * (0.5 + 0.5 * Math.sin(this.t * 18)));
    }

    const pulse = 1 + 0.10 * Math.sin(this.t * 3.4);
    for (const s of GAME.sim.world.stones) {
      if (s.owner === GAME.turn && GAME.inputUnlocked) this.blit('halo-' + (s.owner === 1 ? 'p1' : 'p2'), s.x, s.y, 0.35 + 0.2 * Math.sin(this.t * 3.4), pulse);
    }
    for (const s of GAME.sim.world.stones) this.blit(s.owner === 1 ? 'p1' : 'p2', s.x, s.y);
    this.blit('puck', GAME.sim.world.puck.x, GAME.sim.world.puck.y);

    for (const q of GAME.particles) {
      c.globalAlpha = Math.max(0, q.life);
      c.fillStyle = C[q.scorer === 1 ? 'p1' : 'p2'] || C.p1;
      const pq = this.pt(q.x, q.y);
      c.beginPath(); c.arc(pq.x, pq.y, Math.max(1.5, this.L(0.012)), 0, Math.PI * 2); c.fill();
    }
    c.globalAlpha = 1;

    const aim = INPUT.current();
    if (aim) this.arrow(aim);

    this.hud();
    if (GAME.banner) this.banner();
    if (GAME.goalFx) {
      const k = Math.min(1, GAME.goalFx.t / 300);
      c.save(); c.globalAlpha = Math.max(0, 1 - GAME.goalFx.t / GAME.goalFx.ms);
      c.fillStyle = '#fff'; c.textAlign = 'center';
      c.font = 'bold ' + Math.round(this.L(0.16) * (0.8 + 0.2 * k)) + 'px system-ui, sans-serif';
      c.fillText('Goal!', this.cx, this.cy + this.L(0.06)); c.restore();
    }
  },
  arrow(aim) {
    const b = this.ctx, s = this.metrics;
    const o = this.pt(this._aimBody.x, this._aimBody.y), d = this.dir(aim.dir.x, aim.dir.y);
    const bx = o.x, by = o.y;                               // everything below is in screen px
    const len = s.stonePx * (1.3 + 3.4 * aim.power);
    const ex = bx + d.x * len, ey = by + d.y * len;
    const neutral = aim.cancelled;
    const hue = neutral ? 0 : 135 - 135 * aim.power;
    b.save();

    b.lineWidth = Math.max(3, s.stonePx * 0.22);

    b.globalAlpha = neutral ? 0.55 : 0.95;
    b.beginPath(); b.moveTo(bx + d.x * s.stonePx * 1.05, by + d.y * s.stonePx * 1.05); b.lineTo(ex, ey); b.stroke();
    const ah = s.stonePx * 0.55, a = Math.atan2(ey - by, ex - bx);
    b.beginPath();
    b.moveTo(ex, ey);
    b.lineTo(ex - Math.cos(a - 0.45) * ah, ey - Math.sin(a - 0.45) * ah);
    b.lineTo(ex - Math.cos(a + 0.45) * ah, ey - Math.sin(a + 0.45) * ah);
    b.closePath(); b.fill();
    // drag line back to the finger, so the slingshot intent is legible
    b.setLineDash([5, 5]); b.globalAlpha = .3; b.lineWidth = 1.5;
    b.beginPath(); b.moveTo(bx, by); b.lineTo(INPUT.px, INPUT.py); b.stroke();
    b.restore();
  },
  // The HUD is one box, dots included, and it must fit inside the reserved strip in EITHER
  // layout - so the box is computed here once and the renderer and the layout probe both read
  // the same numbers. Each score sits nearest the end that player defends, which is what lets
  // the pill stay upright and make sense however the table has been laid down.
  hudBox() {
    const size = Math.max(16, Math.round(Math.min(this.band * 0.60, this.L(0.14))));
    const arm = size * 0.88, half = size * 0.62, pad = size * 0.34, dotR = size * 0.16;
    if (this.rot) {
      const x = this.bandLeft + this.band / 2, mid = this.bandMid;   // vertical pill in the gutter
      return {
        size, along: 'y', rot: 1,
        x: x - half - dotR, y: mid - arm - half - pad - dotR, w: 2 * (half + dotR), h: 2 * (arm + half + pad + dotR),
        p1: { x, y: mid + arm }, p2: { x, y: mid - arm }, dash: { x, y: mid },
        dot1: { x, y: mid + arm + half + pad }, dot2: { x, y: mid - arm - half - pad },
      };
    }
    const y = this.bandMid, mid = this.cx;                            // horizontal pill across the top
    return {
      size, along: 'x', rot: 0,
      x: mid - arm - half - pad - dotR, y: y - half - dotR, w: 2 * (arm + half + pad + dotR), h: 2 * (half + dotR),
      p1: { x: mid - arm, y }, p2: { x: mid + arm, y }, dash: { x: mid, y },
      dot1: { x: mid - arm - half - pad, y }, dot2: { x: mid + arm + half + pad, y },
    };
  },
  hud() {
    const c = this.ctx, C = CONFIG.RENDER.colors, b = this.hudBox();
    c.save(); c.textAlign = 'center'; c.textBaseline = 'middle';
    c.font = 'bold ' + b.size + 'px system-ui, sans-serif';
    c.fillStyle = 'rgba(0,0,0,.30)';
    this.rr(c, b.x, b.y, b.w, b.h, b.size * 0.3); c.fill();
    c.fillStyle = C.p1; c.fillText(String(GAME.score[0]), b.p1.x, b.p1.y);
    c.fillStyle = 'rgba(255,255,255,.65)'; c.fillText('\u2013', b.dash.x, b.dash.y);
    c.fillStyle = C.p2; c.fillText(String(GAME.score[1]), b.p2.x, b.p2.y);
    for (const n of [1, 2]) {                     // whose turn: a dot beside that player's own digit
      const on = GAME.turn === n && (GAME.state === 'Aiming' || GAME.state === 'Kickoff');

  banner() {
    const c = this.ctx, C = CONFIG.RENDER.colors, k = GAME.banner.t / GAME.banner.ms;
    const a = Math.min(1, Math.min(k * 6, (1 - k) * 6));
    const name = GAME.turn === 1 ? 'Blue' : 'Orange';
    c.save(); c.globalAlpha = Math.max(0, a); c.textAlign = 'center';
    c.fillStyle = GAME.turn === 1 ? C.p1 : C.p2;
    c.font = 'bold ' + Math.round(Math.max(20, this.L(0.11))) + 'px system-ui, sans-serif';

  },
};

/* ============================== SECTION: PLATFORM ============================== */
const PLATFORM = {
  wake: null, gestureDone: false,
  init() {
    const stop = (el, evs) => { for (const ev of evs) document.addEventListener(ev, (e) => { if (e.cancelable) e.preventDefault(); }, { passive: false }); };
    stop(document, ['contextmenu', 'gesturestart', 'gesturechange', 'gestureend', 'selectstart', 'dblclick']);
    document.addEventListener('touchmove', (e) => {
      if (e.target && e.target.closest && e.target.closest('#debug')) return;   // tuning panel scrolls
      if (e.cancelable) e.preventDefault();
    }, { passive: false });
    window.addEventListener('wheel', (e) => { if (e.cancelable) e.preventDefault(); }, { passive: false });
    window.addEventListener('keydown', (e) => {
      if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key) && e.cancelable) e.preventDefault();
      if (e.key === 'r') GAME.rematch();
    });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { INPUT.abort(); AUDIO.suspend(); }
      else { AUDIO.resume(); this.requestWake(); BOOT.resetClock(); }
    });
    window.addEventListener('blur', () => INPUT.abort());
    document.getElementById('rematch').addEventListener('click', () => { GAME.rematch(); });
    document.getElementById('rotate').addEventListener('click', () => PLATFORM.rotateCheck());
    window.addEventListener('error', (e) => DEBUG.report('ERROR ' + (e.message || '') + ' @line ' + (e.lineno || '?')));
    window.addEventListener('unhandledrejection', (e) => DEBUG.report('REJECT ' + ((e.reason && e.reason.message) || e.reason)));
  },
  firstGesture() {
    AUDIO.unlock(); if (!AUDIO.master && AUDIO.ctx) AUDIO.setMaster();
    if (this.gestureDone) return;
    this.gestureDone = true;
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen({ navigationUI: 'hide' }).then(() => this.lockLayout()).catch(() => {});
    this.requestWake();
  },
  lockLayout() {
    // 'auto' deliberately does NOT lock the screen. The layout follows the window, so the tablet
    // is free to be held or mounted either way and the board just gets as big as it can. Only an
    // explicit ?layout=wide|tall asks the device to turn, and only where that is even allowed
    // (Chrome/Android in fullscreen; iPadOS refuses - design doc 11.4).
    const want = { wide: 'landscape', tall: 'portrait' }[CONFIG.RENDER.layout];
    const o = screen.orientation;
    if (want && o && o.lock) o.lock(want).catch(() => {});
  },
  async requestWake() {
    try { if (navigator.wakeLock && navigator.wakeLock.request && !document.hidden) this.wake = await navigator.wakeLock.request('screen'); } catch (_) {}
  },
  /* This used to be "portrait => unplayable, rotate". That was a legibility rule wearing an
     orientation-shaped proxy: what actually has to be true is that a stone is wide enough to aim
     at and to grab - generously so, because the panel is read in sunlight. The layout now takes
     whichever direction draws the bigger board, so portrait is no longer a reason to refuse.
     The overlay is back only for the case that really is unplayable: a viewport too small to
     produce a legible board in EITHER direction. */
  rotateCheck() {
    const got = 2 * P.stoneR * RENDER.scale, need = CONFIG.RENDER.minStonePx;
    this.smallPx = got;
    this.tooSmall = got < need;
    const el = document.getElementById('rotate');
    el.classList.toggle('on', this.tooSmall);
    if (this.tooSmall) {
      document.getElementById('orientTitle').textContent = 'Too small to play';
      document.getElementById('orientMsg').textContent =
        'Stones are ' + got.toFixed(0) + ' px wide here; the game needs at least ' + need +
        ' px. Turn the tablet, or make the window bigger.';
    }
    return this.tooSmall;
  },
  winner() {
    const w = GAME.score[0] > GAME.score[1] ? 1 : 2, C = CONFIG.RENDER.colors;
    document.getElementById('winnerTitle').textContent = (w === 1 ? 'Blue' : 'Orange') + ' wins';
    document.getElementById('winnerTitle').style.color = w === 1 ? C.p1 : C.p2;
    document.getElementById('winnerScore').textContent = GAME.score[0] + ' – ' + GAME.score[1];
    document.getElementById('winner').classList.add('on');
    AUDIO.fanfare('win');
  },
  hideWinner() { document.getElementById('winner').classList.remove('on'); },
};
/* Insets are PER AXIS, because a notch lives on one edge and which edge that is depends on
   which way the panel is turned. 'wide' pays for left/right, 'tall' for top/bottom - and now
   that portrait is a legal layout, a top notch is reachable for the first time. A single max()
   over all four insets would shrink the board on every panel to pay for an inset it does not
   have, which is exactly how a legibility fix costs you a legibility win. */
function safeInsets() {
  const s = getComputedStyle(document.documentElement);
  const v = (k) => parseFloat(s.getPropertyValue(k)) || 0;
  return { x: Math.max(v('--inset-l'), v('--inset-r')), y: Math.max(v('--inset-t'), v('--inset-b')) };
}

  on: false, fps: 0, frames: 0, fpsT: 0,

    sl('wall e', () => R.wall, (v) => R.wall = v, 0, 1, 0.01);
    sl('body e', () => R.stonePuck, (v) => { R.stonePuck = R.stoneStone = v; }, 0, 1, 0.01);
    sl('maxSpeed', () => P.maxLaunchSpeed, (v) => P.maxLaunchSpeed = v, 0.5, 4, 0.05);
    sl('puckMass', () => P.puckMass, (v) => P.puckMass = v, 0.2, 2, 0.05);
    d.insertAdjacentHTML('beforeend', '<pre id="dstat"></pre><pre id="dtest"></pre>');
    const b1 = document.createElement('button'); b1.textContent = 'selftest';
    b1.addEventListener('click', () => { document.getElementById('dtest').textContent = 'running…'; setTimeout(() => window.__PPG.selftest(), 30); });
    const b3 = document.createElement('button'); b3.textContent = 'ascii map';
    b3.addEventListener('click', () => DEBUG.dumpAscii());
    d.appendChild(b3);
    const b4 = document.createElement('button'); b4.textContent = 'flip layout';
    b4.addEventListener('click', () => { CONFIG.RENDER.layout = RENDER.rot ? 'wide' : 'tall'; RENDER.fit(); });
    d.appendChild(b4);
    const b2 = document.createElement('button'); b2.textContent = 'force settle';
    b2.addEventListener('click', () => { for (const b of GAME.sim.world.bodies) { b.vx = 0; b.vy = 0; b.resting = true; } });
    d.appendChild(b1); d.appendChild(b2);
    if (q.has('selftest')) setTimeout(() => window.__PPG.selftest(Number(q.get('n') || 200)), 200);
    if (q.has('ascii')) setTimeout(() => DEBUG.dumpAscii(Number(q.get('cols') || 74)), 250);
  },
  // A canvas is opaque to a terminal. This renders the frame as a character grid so layout
  // (scoreboard strip, letterbox, felt, bodies) can be read and diffed without a screenshot.
  // Debug-only: it is never called unless the URL asked for it.
  asciiMap(cols) {
    const c = RENDER.canvas.getContext('2d');
    const w = RENDER.canvas.width, h = RENDER.canvas.height;
    if (!w || !h) return 'no canvas';
    const img = c.getImageData(0, 0, w, h).data;
    const n = Math.max(24, Math.min(110, cols || 74));
    const rows = Math.max(8, Math.round(n * (h / w) * 0.52));
    const cls = (r, g, b) => {
      // Ordered, and deliberately thresholded against the *tinted* felt: the turn tint lays a
      // 7-10% player-colour wash over half the board, which would otherwise read as "blue stone".
      if (r > 185 && g > 185 && b > 185) return '#';                    // puck, white marks
      if (b > r + 60 && b > g + 40) return 'B';                         // P1 stones
      if (r > b + 60 && r > g + 40) return 'O';                         // P2 stones
      if (g > 55 && g > r + 20) return ',';                             // felt (tinted or not)
      if (r < 12 && g < 36) return '+';                                 // scoreboard pill
      if (r > 45 && g > 75) return '-';                                 // halos, FX, bright edges
      return '.';                                                      // letterbox / page background
    };
    const out = [];
    for (let ry = 0; ry < rows; ry++) {
      let row = '';
      for (let rx = 0; rx < n; rx++) {
        const x = Math.min(w - 1, Math.floor((rx + 0.5) * w / n));
        const y = Math.min(h - 1, Math.floor((ry + 0.5) * h / rows));
        const i = (y * w + x) * 4;
        row += cls(img[i], img[i + 1], img[i + 2]);
      }
      out.push(row);
    }
    return out.join('\n');
  },
  dumpAscii(cols) {
    const pre = document.getElementById('dtest');

  },
  tickStats(now) {

    const pre = document.getElementById('dstat');
    if (!pre) return;
    const w = GAME.sim.world;
    let sp = [];
    for (const b of w.bodies) sp.push((b.type === 'puck' ? 'P' : b.owner) + ':' + Math.hypot(b.vx, b.vy).toFixed(2));
    pre.textContent = 'fps ' + this.fps + '  state ' + GAME.state + '  turn ' + GAME.turn +
      '\nsubsteps>1 ' + w.subStepHits + '  steps ' + w.totalSteps + '  turnT ' + w.turnTime.toFixed(2) +
      '\nviol ' + w.violations.length + (w.violations.length ? ' :: ' + JSON.stringify(w.violations[0]) : '') +
      '\nspeeds ' + sp.join(' ');
  },
};
