<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Puck Puck Go</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#123c34">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root { --inset-l: env(safe-area-inset-left, 0px); --inset-r: env(safe-area-inset-right, 0px); }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    overflow: hidden; overscroll-behavior: none;
    background: #0d2b26; color: #eef6f2;
    font: 500 clamp(14px, 2.2vmin, 22px)/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  #stage { position: fixed; inset: 0; display: block; touch-action: none; }
  .overlay {
    position: fixed; inset: 0; display: none; place-items: center;
    background: rgba(6, 22, 19, .82); z-index: 10; text-align: center; padding: 6vmin;
  }
  .overlay.on { display: grid; }
  .overlay h1 { font-size: clamp(26px, 7vmin, 72px); margin: 0 0 .3em; letter-spacing: .01em; }
  .overlay p { font-size: clamp(15px, 3vmin, 26px); margin: 0 0 1.4em; opacity: .9; }
  .btn {
    font: inherit; font-size: clamp(18px, 4vmin, 34px); font-weight: 700;
    padding: .5em 1.4em; border: 0; border-radius: .6em; background: #f2c14e; color: #17130b;
    cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none;
  }
  .btn:active { transform: translateY(1px) scale(.99); }
  #debug {
    position: fixed; left: 8px; top: 8px; z-index: 20; display: none;
    background: rgba(0,0,0,.62); color: #d8f5e8; font: 11px/1.5 ui-monospace, Menlo, Consolas, monospace;
    padding: 8px 10px; border-radius: 8px; max-width: 46vmin; max-height: 92vh; overflow: auto;
    touch-action: pan-y;
  }
  #debug.on { display: block; }
  #debug label { display: grid; grid-template-columns: 1fr 4.5em; gap: 6px; align-items: center; }
  #debug h3 { margin: 6px 0 3px; font-size: 11px; text-transform: uppercase; opacity: .7; }
  #debug pre { margin: 4px 0; white-space: pre-wrap; }
  #debug button { font: inherit; margin: 2px 4px 2px 0; }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div class="overlay" id="rotate">
  <div><h1>Rotate to landscape</h1><p>Puck Puck Go is played side by side, in landscape.</p></div>
</div>

<div class="overlay" id="winner">
  <div>
    <h1 id="winnerTitle">Blue wins</h1>
    <p id="winnerScore">5 – 3</p>
    <button class="btn" id="rematch">Rematch</button>
  </div>
</div>

<div id="debug"></div>

<script>
"use strict";
/* =====================================================================================
   PUCK PUCK GO — one self-contained file. Offline. No dependencies, no build step.
   Load order is the module system: each section uses only sections above it.
   GAME emits events; BOOT fans them out to RENDER/AUDIO. Nothing else cross-calls.
   Non-goals (v1): no AI, no network, no trajectory prediction/aim assist, no turn timers,
   no haptics, no settings, no persistence. Do not add device-orientation input: the table
   is top-down by design regardless of how the tablet is mounted in the car.
   ===================================================================================== */

/* ============================== SECTION: CONFIG ============================== */
const CONFIG = {
  PHYSICS: {
    step: 1 / 120, maxSubSteps: 8, maxTravel: 0.02,     // base step, CCD bound (H / sub-step)
    halfW: 0.80, halfH: 0.50, cornerR: 0.12,            // field interior, rounded corners
    mouthHalf: 0.15, goalDepth: 0.08,                   // goal mouth half-width, pocket depth
    stoneR: 0.045, puckR: 0.035, stoneMass: 1.0, puckMass: 0.6,
    restitution: { stoneStone: 0.92, stonePuck: 0.92, wall: 0.75 },
    restitutionSpeedMin: 0.2,                           // below this: no bounce (kills micro-jitter)
    // Tuned against T25: on an empty board a max-power stone must roll ~ONE field length.
    // 3.0 H/s rolled 2.73 H = 171% of the table, so every full pull slammed the far wall.
    maxLaunchSpeed: 2.15, rollingDecel: 0.9, linearDamping: 0.4,
    restThreshold: 0.01, settleConsecutive: 2, settleCap: 12.0, hardSpeedMax: 6.0,
    iterations: 4, posIterations: 5, slop: 0.0005, correction: 0.4,
    nudgeGap: 0.035, nudgeDuration: 0.15, scoreMargin: 0.01,
  },
  AIM: {
    maxDragFraction: 0.25,                              // max drag = 0.25 x field height (CSS px)
    deadZonePx: 6, grabTolerancePx: 12, grabToleranceRatio: 0.35,
    angleStepDeg: 0.05, powerStep: 0.004,               // determinism lattice
  },
  GAME: { winScore: 5, bannerMs: 1000, celebrationMs: 2000 },
  RENDER: { marginPx: 8, particleCap: 60, dprMax: 3,
    hudBand: { frac: 0.10, min: 34, max: 72 },              // strip above the field, for the score
    colors: {
    p1: '#3d8cff', p1dim: '#1d4f9c', p2: '#ff8a3d', p2dim: '#a4501c',
    felt: '#16473e', feltEdge: '#0f352e', line: '#2f6b5f', puck: '#f4f7f4', puckRing: '#1c2b26' } },
  AUDIO: { pairThrottleMs: 50, maxVoices: 8 },
  LAYOUT: { p1: [[-0.65, -0.15], [-0.65, 0.15], [-0.50, 0], [-0.35, -0.15], [-0.35, 0.15]], puck: [0, 0] },
};
const P = CONFIG.PHYSICS;

/* ============================== SECTION: GEOMETRY ============================== */
/* The boundary is a signed-distance field, evaluated per body class:
     stones: the rounded box only  => the goal mouth is SOLID WALL
     puck:   rounded box UNION two goal pockets => the mouth is an OPENING
   "Stones never enter a goal" is therefore structural, not something to test for. */
const GEOM = (() => {
  const pocketCx = P.halfW + P.goalDepth / 2, pocketHx = P.goalDepth / 2;
  function sdBox(x, y, hx, hy) {
    const ax = Math.max(Math.abs(x) - hx, 0), ay = Math.max(Math.abs(y) - hy, 0);
    return Math.sqrt(ax * ax + ay * ay) + Math.min(Math.max(Math.abs(x) - hx, Math.abs(y) - hy), 0);
  }
  function sdField(x, y) {
    const ox = Math.abs(x) - P.halfW + P.cornerR, oy = Math.abs(y) - P.halfH + P.cornerR;
    const ax = Math.max(ox, 0), ay = Math.max(oy, 0);
    return Math.sqrt(ax * ax + ay * ay) + Math.min(Math.max(ox, oy), 0) - P.cornerR;
  }
  // A *neck* box straddles each goal line, reaching from deep inside the field to the back of
  // the pocket. Without it, min(sdField, sdPocket) under-reports clearance at the mouth plane
  // and the puck bounces off an imaginary wall 1 puck radius short of the opening: the neck
  // makes the goal line stop being a wall exactly where the mouth is, while sdField keeps the
  // posts solid and the end wall solid outside |y| <= mouthHalf.
  const neckLen = 0.30;
  const neckCx = P.halfW + P.goalDepth / 2, neckHx = P.goalDepth / 2 + neckLen / 2;
  const sdMouthR = (x, y) => sdBox(x - neckCx, y, neckHx, P.mouthHalf);
  const sdMouthL = (x, y) => sdBox(x + neckCx, y, neckHx, P.mouthHalf);
  const sdStones = (x, y) => sdField(x, y);                 // mouth is SOLID for stones
  const sdPuck = (x, y) => Math.min(sdField(x, y), sdMouthR(x, y), sdMouthL(x, y));
  // numeric gradient of an SDF = outward (increasing-d) unit normal; deterministic arithmetic
  function grad(f, x, y) {
    const e = 1e-5, gx = f(x + e, y) - f(x - e, y), gy = f(x, y + e) - f(x, y - e);
    const l = Math.sqrt(gx * gx + gy * gy);
    return l > 0 ? { x: gx / l, y: gy / l } : { x: 0, y: 0 };
  }
  const inPocket = (x) => Math.abs(x) > P.halfW;
  const scoreLine = P.halfW + P.puckR;                  // puck center crosses => fully crossed
  const LAYOUT = {
    p1: CONFIG.LAYOUT.p1.map(([x, y]) => ({ x, y })),
    p2: CONFIG.LAYOUT.p1.map(([x, y]) => ({ x: -x, y })),
    puck: { x: CONFIG.LAYOUT.puck[0], y: CONFIG.LAYOUT.puck[1] },
  };
  const DRAW = { minX: -(P.halfW + P.goalDepth), maxX: P.halfW + P.goalDepth, minY: -P.halfH, maxY: P.halfH };
  return { sdField, sdStones, sdPuck, grad, inPocket, scoreLine, LAYOUT, DRAW, pocketCx, pocketHx };
})();

/* ============================== SECTION: SOLVER ============================== */
/* 11 circles, no rotation, zero inter-body friction => every contact is a 1-D impulse
   along one normal. n always points from A toward the other collider (or into the wall). */
const SOLVER = {
  detect(world, out) {
    const bs = world.bodies;
    for (let i = 0; i < bs.length; i++) {
      const a = bs[i];
      const sd = a.type === 'puck' ? GEOM.sdPuck : GEOM.sdStones;
      const d = sd(a.x, a.y);
      if (d > -a.r) {                                   // surface is inside the wall
        const g = GEOM.grad(sd, a.x, a.y);
        out.push({ a, b: null, nx: g.x, ny: g.y, depth: d + a.r, e: P.restitution.wall, wall: true });
      }
      for (let j = i + 1; j < bs.length; j++) {
        const b = bs[j], dx = b.x - a.x, dy = b.y - a.y;
        const d2 = dx * dx + dy * dy, rr = a.r + b.r;
        if (d2 < rr * rr && d2 > 0) {
          const dist = Math.sqrt(d2), inv = 1 / dist;
          const kind = (a.type === 'puck' || b.type === 'puck') ? 'stonePuck' : 'stoneStone';
          out.push({ a, b, nx: dx * inv, ny: dy * inv, depth: rr - dist, e: P.restitution[kind] });
        }
      }
    }
  },

  solveVel(world, contacts) {
    for (let it = 0; it < P.iterations; it++) {
      for (const c of contacts) {
        const A = c.a, B = c.b;
        const rvx = (B ? B.vx : 0) - A.vx, rvy = (B ? B.vy : 0) - A.vy;
        const vn = rvx * c.nx + rvy * c.ny;
        if (vn >= 0) continue;                          // separating
        const approach = -vn;
        const e = approach > P.restitutionSpeedMin ? c.e : 0;
        const imSum = A.im + (B ? B.im : 0);
        const j = -(1 + e) * vn / imSum;
        A.vx -= c.nx * j * A.im; A.vy -= c.ny * j * A.im;
        if (B) { B.vx += c.nx * j * B.im; B.vy += c.ny * j * B.im; }
        if (it === 0 && approach > 0.08) world.emit(A, B, approach, c.wall);
      }
    }
  },

  solvePos(world, contacts) {
    const bs = world.bodies;
    for (let it = 0; it < P.posIterations; it++) {
      for (const c of contacts) {
        const A = c.a, B = c.b;
        if (B) {
          const dx = B.x - A.x, dy = B.y - A.y;
          const dist = Math.sqrt(dx * dx + dy * dy) || 1e-9, rr = A.r + B.r;
          const pen = rr - dist; if (pen <= P.slop) continue;
          const nx = dx / dist, ny = dy / dist;
          const k = Math.max(pen - P.slop, 0) * P.correction / (A.im + B.im);
          A.x -= nx * k * A.im; A.y -= ny * k * A.im;
          B.x += nx * k * B.im; B.y += ny * k * B.im;
        } else {
          const sd = A.type === 'puck' ? GEOM.sdPuck : GEOM.sdStones;
          const d = sd(A.x, A.y); if (d > -A.r + P.slop) continue;
          const g = GEOM.grad(sd, A.x, A.y);
          const pen = (d + A.r - P.slop) * P.correction;
          A.x -= g.x * pen; A.y -= g.y * pen;
        }
      }
    }
    // Hard invariant: no body may be left inside a wall. This is what guarantees stones
    // can never be found in a goal, whatever the iterative solver did.
    for (let pass = 0; pass < 3; pass++) {
      for (const b of bs) {
        const sd = b.type === 'puck' ? GEOM.sdPuck : GEOM.sdStones;
        const d = sd(b.x, b.y);
        if (d > -b.r) { const g = GEOM.grad(sd, b.x, b.y); b.x -= g.x * (d + b.r); b.y -= g.y * (d + b.r); }
      }
    }
  },

  // exact solution of dv/dt = -a - k*v, so the tuning table in the design doc is exactly
  // what the code computes (and sub-stepping cannot perturb settle behaviour)
  integrate(world, h) {
    const a = P.rollingDecel, k = P.linearDamping;
    for (const b of world.bodies) {
      const sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
      if (sp <= 0) { b.resting = true; continue; }
      let ns, dx;
      if (k > 1e-9) {
        const shift = a / k;
        ns = (sp + shift) * Math.exp(-k * h) - shift;
        if (ns < 0) ns = 0;
        dx = (sp - ns) / k - shift * h;
      } else if (a > 1e-9) {
        ns = Math.max(0, sp - a * h); dx = (sp * sp - ns * ns) / (2 * a);
      } else { ns = sp; dx = sp * h; }
      if (ns < P.restThreshold) { ns = 0; dx = 0; }
      const cap = sp * h; if (dx > cap) dx = cap; if (dx < 0) dx = 0;
      const inv = 1 / sp;
      b.x += b.vx * inv * dx; b.y += b.vy * inv * dx;
      if (ns === 0) { b.vx = 0; b.vy = 0; b.resting = true; }
      else { b.vx *= ns / sp; b.vy *= ns / sp; b.resting = false; }
      if (b.vx !== b.vx || b.vy !== b.vy) { b.vx = 0; b.vy = 0; }
    }
  },
};

/* ============================== SECTION: SIM ============================== */
/* The entire engine boundary. GAME/INPUT/RENDER may not touch physics internals.
   Swapping in another engine (see design doc D1) means replacing SOLVER + SIM only. */
const SIM = {
  create(cfg = P) {
    const w = {
      bodies: [], stones: [], puck: null, cfg,
      goal: null, events: [], violations: [], turnTime: 0, totalSteps: 0, subStepHits: 0,
      emit(a, b, speed, wall) { w.events.push({ a: a.id, b: b ? b.id : -1, speed, wall: !!wall, kind: b === null ? 'wall' : (a.type === 'puck' || b.type === 'puck') ? 'puck' : 'stone' }); },
    };
    let id = 0;
    function add(type, owner, x, y) {
      const r = type === 'puck' ? cfg.puckR : cfg.stoneR;
      const m = type === 'puck' ? cfg.puckMass : cfg.stoneMass;
      const b = { id: id++, type, owner, x, y, vx: 0, vy: 0, r, im: 1 / m, resting: true };
      w.bodies.push(b); if (type === 'puck') w.puck = b; else w.stones.push(b);
      return b;
    }
    function reset() {
      w.bodies.length = 0; w.stones.length = 0; w.puck = null; w.goal = null;
      w.events.length = 0; w.turnTime = 0; id = 0;
      for (const s of GEOM.LAYOUT.p1) add('stone', 1, s.x, s.y);
      for (const s of GEOM.LAYOUT.p2) add('stone', 2, s.x, s.y);
      add('puck', 0, GEOM.LAYOUT.puck.x, GEOM.LAYOUT.puck.y);
    }
    reset();

    function subStep(h) {
      SOLVER.integrate(w, h);
      const contacts = [];
      SOLVER.detect(w, contacts);
      SOLVER.solveVel(w, contacts);
      SOLVER.solvePos(w, contacts);
      for (const b of w.bodies) {
        const sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
        if (sp > cfg.hardSpeedMax) { const k = cfg.hardSpeedMax / sp; b.vx *= k; b.vy *= k; }
        if (sp < cfg.restThreshold) { b.vx = 0; b.vy = 0; b.resting = true; }
        check(b);
      }
    }
    function check(b) {
      if (!(typeof DEBUG_FLAGS !== 'undefined' && DEBUG_FLAGS.check)) return;
      const sd = b.type === 'puck' ? GEOM.sdPuck : GEOM.sdStones;
      const d = sd(b.x, b.y);
      if (d > -b.r + 1e-7) w.violations.push({ id: b.id, x: b.x, y: b.y, vx: b.vx, vy: b.vy, d: d + b.r });
      if (b.type === 'stone' && Math.abs(b.x) > cfg.halfW + 1e-7)
        w.violations.push({ id: b.id, x: b.x, y: b.y, vx: b.vx, vy: b.vy, d: Math.abs(b.x) - cfg.halfW });
    }

    function step(dt = cfg.step) {
      if (w.goal) return;
      let vmax = 0;
      for (const b of w.bodies) { const s = Math.abs(b.vx) + Math.abs(b.vy); if (s > vmax) vmax = s; }
      let n = Math.ceil((2 * vmax * dt) / cfg.maxTravel);
      n = n < 1 ? 1 : (n > cfg.maxSubSteps ? cfg.maxSubSteps : n);
      if (n > 1) w.subStepHits++;
      for (let i = 0; i < n; i++) subStep(dt / n);
      w.totalSteps++;
      w.turnTime += dt;
      // scoring: region test, evaluated before any rescue from contact handling
      const px = w.puck.x;
      if (px >= GEOM.scoreLine) w.goal = { scorer: 1, conceder: 2, side: 'right', x: px };
      else if (px <= -GEOM.scoreLine) w.goal = { scorer: 2, conceder: 1, side: 'left', x: px };
      if (w.turnTime > cfg.settleCap && !allAtRest()) {
        w.timedOut = true;
        for (const b of w.bodies) { b.vx = 0; b.vy = 0; b.resting = true; }
      }
    }
    function allAtRest() { for (const b of w.bodies) if (!b.resting) return false; return true; }

    // PRD rule 8: a puck at rest against an OUTER wall/corner eases clear.
    // Kinematic (never an impulse), puck-only, and clamped so it can never cause a goal.
    function nudgeTarget() {
      const p = w.puck;
      if (GEOM.inPocket(p.x)) return null;               // hanging pucks are live, not nudged
      const d = GEOM.sdField(p.x, p.y);
      const clearance = -d - p.r;
      if (clearance >= cfg.nudgeGap) return null;
      const g = GEOM.grad(GEOM.sdField, p.x, p.y);
      const move = (cfg.nudgeGap - clearance) + 0.002;
      let tx = p.x - g.x * move, ty = p.y - g.y * move;
      const limit = GEOM.scoreLine - cfg.scoreMargin;
      if (tx > limit) tx = limit; if (tx < -limit) tx = -limit;
      const dd = GEOM.sdField(tx, ty);
      if (dd > -p.r) { const g2 = GEOM.grad(GEOM.sdField, tx, ty); tx -= g2.x * (dd + p.r); ty -= g2.y * (dd + p.r); }
      return { x: tx, y: ty };
    }
    function relaxAgainstBodies(puck) {
      for (let it = 0; it < 20; it++) {
        let moved = false;
        for (const b of w.bodies) {
          if (b === puck) continue;
          const dx = puck.x - b.x, dy = puck.y - b.y, rr = puck.r + b.r;
          const d2 = dx * dx + dy * dy;
          if (d2 < rr * rr) {
            const dist = Math.sqrt(d2) || 1e-9, push = (rr - dist) / dist;
            puck.x += dx * push; puck.y += dy * push; moved = true;
          }
        }
        const d = GEOM.sdField(puck.x, puck.y);
        if (d > -puck.r) { const g = GEOM.grad(GEOM.sdField, puck.x, puck.y); puck.x -= g.x * (d + puck.r); puck.y -= g.y * (d + puck.r); moved = true; }
        if (!moved) break;
      }
    }

    return {
      world: w, reset, step, allAtRest, subStep, nudgeTarget, relaxAgainstBodies,
      fire(body, angle, speed) {
        body.vx = Math.cos(angle) * speed; body.vy = Math.sin(angle) * speed;
        body.resting = false; w.turnTime = 0; w.timedOut = false;
      },
      stoneAt(x, y, rPx) {
        let best = null, bd = Infinity;
        for (const s of w.stones) {
          const dx = s.x - x, dy = s.y - y, d = Math.sqrt(dx * dx + dy * dy);
          if (d <= rPx && d < bd) { best = s; bd = d; }
        }
        return best;
      },
      maxSpeed() { let m = 0; for (const b of w.bodies) { const s = Math.hypot(b.vx, b.vy); if (s > m) m = s; } return m; },
      kinetic() { let e = 0; for (const b of w.bodies) e += 0.5 * (1 / b.im) * (b.vx * b.vx + b.vy * b.vy); return e; },
    };
  },
};
/* ============================== SECTION: PRNG ============================== */
function mulberry32(seed) {
  let t = seed >>> 0;
  return function () {
    t = (t + 0x6D2B79F5) >>> 0;
    let r = Math.imul(t ^ (t >>> 15), 1 | t);
    r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}
/* ?seed= pins the run for reproducible debugging and for the self-tests. Without it the seed
   is fresh per page load, because the PRD asks for a random first player - a constant default
   made every match start with the same player, which is not random, just predictable.
   Physics stays reproducible either way: launches are quantized from input, not from this. */
const SEED_PARAM = new URLSearchParams(location.search).get('seed');
const SEED = SEED_PARAM === null ? ((Math.random() * 0x100000000) >>> 0) : Number(SEED_PARAM);
const rand = mulberry32(SEED);

/* ============================== SECTION: GAME ============================== */
/* Rules live here and nowhere else. GAME never calls RENDER/AUDIO directly; it emits. */
const GAME = {
  sim: SIM.create(),
  state: 'Kickoff', score: [0, 0], turn: 1, startPlayer: 1,
  banner: null, goalFx: null, particles: [], nudge: null, restRun: 0,
  handlers: {},
  on(ev, fn) { (this.handlers[ev] ||= []).push(fn); },
  emit(ev, a, b, c) { for (const fn of (this.handlers[ev] || [])) fn(a, b, c); },
  get inputUnlocked() { return this.state === 'Aiming'; },

  newMatch() {
    this.score = [0, 0];
    this.startPlayer = rand() < 0.5 ? 1 : 2;
    this.turn = this.startPlayer;
    this.sim.reset();
    this.goalFx = null; this.particles = []; this.nudge = null;
    this.enter('Kickoff');
  },
  enter(s) {
    this.state = s; this.restRun = 0;
    if (s === 'Kickoff') this.banner = { player: this.turn, t: 0, ms: CONFIG.GAME.bannerMs };
    if (s === 'Settling') this.finishSettle();          // PRD rule 8 wall nudge
    this.emit('state', s);
  },
  startTurn() { this.enter('Kickoff'); },

  fire(body, angle, speed) {                       // from INPUT; already validated
    this.sim.fire(body, angle, speed);
    this.restRun = 0;
    this.emit('shot', body, angle, speed);
    this.enter('Simulating');
  },

  tick() {                                          // one fixed physics step
    if (this.state !== 'Simulating') return;
    this.sim.step();
    for (const ev of this.sim.world.events) this.emit('hit', ev);
    this.sim.world.events.length = 0;
    if (this.sim.world.goal) { this.onGoal(this.sim.world.goal); return; }
    if (this.sim.allAtRest()) {
      if (++this.restRun >= CONFIG.PHYSICS.settleConsecutive) {
        this.turn = this.turn === 1 ? 2 : 1;      // PRD: turns alternate; a goal overrides this
        this.enter('Settling');
      }
    }
    else this.restRun = 0;
  },

  onGoal(g) {
    this.score[g.scorer - 1]++;
    this.turn = g.conceder;                         // conceder takes the next shot
    this.goalFx = { t: 0, ms: CONFIG.GAME.celebrationMs, scorer: g.scorer, side: g.side };
    this.spawnParticles(g);
    this.emit('goal', g, this.score.slice());
    this.enter('Goal');
  },
  spawnParticles(g) {
    const n = Math.min(CONFIG.RENDER.particleCap, 44), side = g.side;
    for (let i = 0; i < n; i++) {
      const a = rand() * Math.PI * 2, sp = 0.25 + rand() * 1.1;
      this.particles.push({
        x: side === 'right' ? P.halfW : -P.halfW, y: (rand() - 0.5) * 0.3,
        vx: Math.cos(a) * sp * (side === 'right' ? -1 : 1), vy: Math.sin(a) * sp,
        life: 1, scorer: g.scorer,
      });
    }
  },
  finishSettle() {
    const target = this.sim.nudgeTarget();
    if (target) {
      const p = this.sim.world.puck;
      this.nudge = { from: { x: p.x, y: p.y }, to: target, t: 0, ms: CONFIG.PHYSICS.nudgeDuration * 1000 };
      this.emit('nudge', target);
    } else this.startTurn();
  },

  update(dt) {                                      // dt = real seconds since last frame
    const step = CONFIG.PHYSICS.step;
    this._acc = Math.min((this._acc || 0) + Math.min(dt, 0.1), 0.25);
    while (this._acc >= step) { this.tick(); this._acc -= step; }

    if (this.banner && (this.banner.t += dt * 1000) >= this.banner.ms) {
      this.banner = null;
      if (this.state === 'Kickoff') this.enter('Aiming');
    }
    if (this.goalFx && (this.goalFx.t += dt * 1000) >= this.goalFx.ms) {
      const won = Math.max(this.score[0], this.score[1]) >= CONFIG.GAME.winScore;
      this.goalFx = null;
      if (won) this.enter('MatchOver');
      else { this.sim.reset(); this.startTurn(); }
    }
    if (this.nudge) {
      const k = Math.min(1, (this.nudge.t += dt * 1000) / this.nudge.ms);
      const e = k * k * (3 - 2 * k), p = this.sim.world.puck;
      p.x = this.nudge.from.x + (this.nudge.to.x - this.nudge.from.x) * e;
      p.y = this.nudge.from.y + (this.nudge.to.y - this.nudge.from.y) * e;
      if (k >= 1) { this.sim.relaxAgainstBodies(p); this.nudge = null; this.startTurn(); }
    }
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const q = this.particles[i];
      q.x += q.vx * dt; q.y += q.vy * dt; q.vx *= 0.94; q.vy *= 0.94; q.life -= dt * 0.7;
      if (q.life <= 0) this.particles.splice(i, 1);
    }
  },

  rematch() { this.newMatch(); },
};

/* ============================== SECTION: INPUT ============================== */
/* Slingshot. One captured pointer owns an aim. A shot CANNOT fire until the pointer has
   travelled past the dead zone, so a phantom/ghost touch (capacitive noise while the tablet
   is charging from the car USB port) is inert by construction. Do not tune that away. */
const INPUT = {
  pointerId: null, body: null, px: 0, py: 0, sx: 0, sy: 0, moved: false,
  attach(canvas) {
    canvas.addEventListener('pointerdown', this.onDown.bind(this), { passive: false });
    canvas.addEventListener('pointermove', this.onMove.bind(this), { passive: false });
    canvas.addEventListener('pointerup', this.onUp.bind(this), { passive: false });
    canvas.addEventListener('pointercancel', this.onCancel.bind(this), { passive: false });
    window.addEventListener('blur', () => this.abort());
  },
  abort() { if (this.pointerId !== null) this.release(); this.body = null; },
  onDown(e) {
    PLATFORM.firstGesture();
    if (this.pointerId !== null) return;             // second finger / ghost: ignored entirely
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (!GAME.inputUnlocked) return;
    const hit = RENDER.pickStone(e.clientX, e.clientY, GAME.turn);
    if (!hit) return;                               // puck, opponent stones, empty field: nothing
    this.pointerId = e.pointerId; this.body = hit.body;
    this.px = e.clientX; this.py = e.clientY;
    this.moved = false;
    try { RENDER.canvas.setPointerCapture(e.pointerId); } catch (_) {}
    this.sample();
  },
  onMove(e) {
    if (e.pointerId !== this.pointerId) return;      // only the captured pointer, ever
    this.px = e.clientX; this.py = e.clientY; this.moved = true; this.sample();
  },
  onUp(e) {
    if (e.pointerId !== this.pointerId) return;
    this.px = e.clientX; this.py = e.clientY; this.sample();
    const aim = this.aimVector();
    this.release();
    if (aim && !aim.cancelled && aim.speed > 0) GAME.fire(this.body, aim.angle, aim.speed);
    this.body = null;
  },
  onCancel() { this.release(); this.body = null; },  // system gesture / app switch = cancel
  release() {
    if (this.pointerId !== null) { try { RENDER.canvas.releasePointerCapture(this.pointerId); } catch (_) {} }
    this.pointerId = null;
  },
  sample() { const w = RENDER.toWorld(this.px, this.py); this.sx = w.x; this.sy = w.y; },
  // direction = stone -> away from finger; power linear in drag past the dead zone, clamped
  aimVector() {
    const b = this.body; if (!b) return null;
    const st = RENDER.metrics;
    const dxw = b.x - this.sx, dyw = b.y - this.sy;
    // sxPx takes an x, syPx takes a y (one argument each). Mixing these up silently
    // corrupts every pull distance, and the dead zone stops being a phantom-touch floor.
    const dpx = Math.hypot(this.px - st.sxPx(b.x), this.py - st.syPx(b.y));
    const dead = st.stonePx + CONFIG.AIM.deadZonePx;
    const maxDrag = CONFIG.AIM.maxDragFraction * st.fieldHpx;
    const len = Math.hypot(dxw, dyw);
    const l2 = len > 0 ? { x: dxw / len, y: dyw / len } : { x: 1, y: 0 };
    const t0 = Math.max(0, Math.min(1, (dpx - dead) / Math.max(1, maxDrag - dead)));
    const ps = CONFIG.AIM.powerStep;
    const t = Math.round(t0 / ps) * ps;
    const as = CONFIG.AIM.angleStepDeg * Math.PI / 180;
    const angle = Math.round(Math.atan2(l2.y, l2.x) / as) * as;
    return {
      dir: l2, power: t, dpx, dead, maxDrag, cancelled: dpx <= dead,
      angle, speed: t * P.maxLaunchSpeed,
    };
  },
  current() { return this.pointerId !== null && this.body ? this.aimVector() : null; },
};

/* ============================== SECTION: AUDIO ============================== */
/* Synthesized only (no audio files). Unlocked synchronously inside the first pointerdown. */
const AUDIO = {
  ctx: null, unlocked: false, last: new Map(), voices: 0, noise: null,
  unlock() {
    if (this.unlocked) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try {
      this.ctx = new AC();
      const sr = this.ctx.sampleRate, buf = this.ctx.createBuffer(1, Math.floor(sr * 0.05), sr);
      const ch = buf.getChannelData(0);
      for (let i = 0; i < ch.length; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / ch.length);
      this.noise = buf;
      this.ctx.resume();
      const g = this.ctx.createGain(); g.gain.value = 0; g.connect(this.ctx.destination);
      const o = this.ctx.createOscillator(); o.connect(g); o.start(); o.stop(this.ctx.currentTime + 0.01);
      this.setMaster();                    // compressor bus: created with the context, always
      this.unlocked = true;
    } catch (_) { /* audio is not load-bearing */ }
  },
  ready() { return this.unlocked && this.ctx.state === 'running'; },
  hit(ev) {
    if (!this.ready() || this.voices >= CONFIG.AUDIO.maxVoices) return;
    const key = ev.a < ev.b ? ev.a + ':' + ev.b : ev.b + ':' + ev.a;
    const now = this.ctx.currentTime * 1000;
    const prev = this.last.get(key) || -1e9;
    if (now - prev < CONFIG.AUDIO.pairThrottleMs) return;
    this.last.set(key, now);
    const s = Math.max(0.02, Math.min(1, ev.speed / P.maxLaunchSpeed));
    if (ev.kind === 'wall') this.tone(noiseVoice(this.ctx, this.noise, 400 + 1800 * s), 0.10 * s + 0.02, 0.05);
    else if (ev.kind === 'puck') this.tone(oscVoice(this.ctx, 700 + 900 * s, 'triangle'), 0.16 * s + 0.03, 0.07);
    else this.tone(oscVoice(this.ctx, 300 + 700 * s, 'triangle'), 0.22 * s + 0.04, 0.11, 0.66);
  },
  tone(v, gain, dur, detune) {
    const ctx = this.ctx, g = ctx.createGain(), t = ctx.currentTime;
    g.gain.setValueAtTime(Math.min(0.5, gain), t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    if (detune) v.node.detune && (v.node.detune.value = detune * 1200);
    this.voices++;
    const self = this;
    g.connect(this.master);
    v.out.connect(g);
    v.start(t);                            // unscheduled start: stop() without start() throws
    v.stop(t + dur + 0.02);
    setTimeout(() => { self.voices--; }, (dur + 0.05) * 1000);
  },
  fanfare(kind) {
    if (!this.ready()) return;
    const seq = kind === 'goal' ? [523, 659, 784] : [523, 659, 784, 1047];
    seq.forEach((f, i) => setTimeout(() => this.tone(oscVoice(this.ctx, f, 'square'), 0.14, 0.22), i * 110));
  },
  suspend() { if (this.ready()) this.ctx.suspend(); },
  resume() { if (this.unlocked) this.ctx.resume(); },
  setMaster() {
    const comp = this.ctx.createDynamicsCompressor();
    comp.connect(this.ctx.destination); this.master = comp;
  },
};
function oscVoice(ctx, freq, type) {
  const o = ctx.createOscillator(); o.type = type; o.frequency.value = freq;
  const g = ctx.createGain(); g.gain.value = 1; o.connect(g);
  return { node: o, out: g, start: (t) => o.start(t), stop: (t) => o.stop(t) };
}
function noiseVoice(ctx, buf, cutoff) {
  const s = ctx.createBufferSource(); s.buffer = buf;
  const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff;
  s.connect(f); return { node: s, out: f, start: (t) => s.start(t), stop: (t) => s.stop(t) };
}

/* ============================== SECTION: RENDER ============================== */
const RENDER = {
  canvas: document.getElementById('stage'),
  ctx: null, dpr: 1, scale: 1, cx: 0, cy: 0, W: 0, H: 0,
  stat: null, sctx: null, sprites: {}, paths: {}, t: 0, band: 0, bandTop: 0, bandMid: 0,
  init() {
    this.ctx = this.canvas.getContext('2d');
    this.fit();
    window.addEventListener('resize', () => this.fit());
    window.addEventListener('orientationchange', () => setTimeout(() => this.fit(), 120));
    if (window.visualViewport) window.visualViewport.addEventListener('resize', () => this.fit());
  },
  fit() {
    const W = window.innerWidth, H = window.innerHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, CONFIG.RENDER.dprMax);
    const m = CONFIG.RENDER.marginPx + Math.max(
      (navigator.vibrate ? 0 : 0),
      safeInset());
    // The scoreboard owns a strip across the top; the field is laid out in what is left,
    // so the score is never painted over the felt and the play area shrinks by exactly the
    // height of the scoreboard (asserted by T26).
    const band = this.bandPx(H);
    const dw = GEOM.DRAW.maxX - GEOM.DRAW.minX, dh = GEOM.DRAW.maxY - GEOM.DRAW.minY;
    const availH = Math.max(48, H - 2 * m - band);
    const scale = Math.min((W - 2 * m) / dw, availH / dh);
    this.band = band; this.bandTop = m; this.bandMid = m + band / 2;
    this.W = W; this.H = H; this.dpr = dpr; this.scale = scale;
    this.cx = W / 2;
    this.cy = m + band + availH / 2;                    // centred below the strip
    this.canvas.width = Math.round(W * dpr); this.canvas.height = Math.round(H * dpr);
    this.canvas.style.width = W + 'px'; this.canvas.style.height = H + 'px';
    this.bakeStatic(); this.bakeSprites();
    PLATFORM.rotateCheck();
  },
  bandPx(H) {
    const b = CONFIG.RENDER.hudBand;
    return Math.round(Math.max(b.min, Math.min(H * b.frac, b.max)));
  },
  // world -> css px
  X(x) { return this.cx + x * this.scale; },
  Y(y) { return this.cy - y * this.scale; },
  L(v) { return v * this.scale; },
  toWorld(px, py) { return { x: (px - this.cx) / this.scale, y: (this.cy - py) / this.scale }; },
  get metrics() {
    const self = this;
    return { sxPx: (x) => self.X(x), syPx: (y) => self.Y(y), fieldHpx: 2 * P.halfH * this.scale, stonePx: P.stoneR * this.scale };
  },
  pickStone(px, py, player) {
    const r = P.stoneR * this.scale + Math.max(CONFIG.AIM.grabTolerancePx, CONFIG.AIM.grabToleranceRatio * P.stoneR * this.scale);
    let best = null, bd = Infinity;
    for (const s of GAME.sim.world.stones) {
      if (s.owner !== player) continue;
      const dx = this.X(s.x) - px, dy = this.Y(s.y) - py, d = Math.hypot(dx, dy);
      if (d <= r && d < bd) { best = { body: s, d }; bd = d; }
    }
    return best;
  },

  rr(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y); c.lineTo(x + w - r, y); c.quadraticCurveTo(x + w, y, x + w, y + r);
    c.lineTo(x + w, y + h - r); c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    c.lineTo(x + r, y + h); c.quadraticCurveTo(x, y + h, x, y + h - r);
    c.lineTo(x, y + r); c.quadraticCurveTo(x, y, x + r, y); c.closePath();
  },
  fieldOutline(c) {                                   // rounded rect in css px
    const x = this.X(-P.halfW), y = this.Y(P.halfH);
    this.rr(c, x, y, this.L(2 * P.halfW), this.L(2 * P.halfH), this.L(P.cornerR));
  },
  bakeStatic() {
    const c0 = this.stat || (this.stat = document.createElement('canvas'));
    c0.width = this.canvas.width; c0.height = this.canvas.height;
    const c = c0.getContext('2d');
    c.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    c.clearRect(0, 0, this.W, this.H);
    const C = CONFIG.RENDER.colors;
    // pockets first (behind felt edge), then felt, so the mouth reads as an opening
    for (const side of [-1, 1]) {
      const x0 = this.X(side === 1 ? P.halfW : -(P.halfW + P.goalDepth));
      c.fillStyle = C.feltEdge;
      c.fillRect(x0, this.Y(P.mouthHalf), this.L(P.goalDepth), this.L(2 * P.mouthHalf));
      c.strokeStyle = C.line; c.lineWidth = 1.5;
      c.strokeRect(x0, this.Y(P.mouthHalf), this.L(P.goalDepth), this.L(2 * P.mouthHalf));
    }
    this.fieldOutline(c); c.fillStyle = C.felt; c.fill();
    c.save(); this.fieldOutline(c); c.clip();
    c.strokeStyle = 'rgba(255,255,255,.07)'; c.lineWidth = Math.max(2, this.L(0.02));
    c.beginPath(); c.arc(this.X(0), this.Y(0), this.L(0.16), 0, Math.PI * 2); c.stroke();
    c.strokeStyle = 'rgba(255,255,255,.10)'; c.lineWidth = Math.max(1, this.L(0.008));
    c.beginPath(); c.moveTo(this.X(0), this.Y(P.halfH)); c.lineTo(this.X(0), this.Y(-P.halfH)); c.stroke();
    c.restore();
    this.fieldOutline(c); c.strokeStyle = 'rgba(230,246,238,.30)'; c.lineWidth = 2; c.stroke();
    // thin goal line: a stone resting against the (invisible) mouth wall must read correctly
    for (const side of [-1, 1]) {
      c.strokeStyle = 'rgba(255,255,255,.22)'; c.lineWidth = 1; c.setLineDash([4, 4]);
      c.beginPath(); c.moveTo(this.X(side * P.halfW), this.Y(P.mouthHalf)); c.lineTo(this.X(side * P.halfW), this.Y(-P.mouthHalf)); c.stroke();
      c.setLineDash([]);
    }
  },
  sprite(key, rPx, draw) {
    const pad = Math.ceil(rPx * 1.9), size = Math.ceil(2 * rPx + 2 * pad);
    const cv = document.createElement('canvas');
    cv.width = Math.ceil(size * this.dpr); cv.height = Math.ceil(size * this.dpr);
    const c = cv.getContext('2d');
    // Local (0,0) is the BODY centre, so the sprite canvas must be padded by pad+rPx on
    // each side: padding by pad alone shifts every stone and the puck by one radius, which
    // desyncs what you see from what you can grab.
    c.setTransform(this.dpr, 0, 0, this.dpr, (pad + rPx) * this.dpr, (pad + rPx) * this.dpr);
    draw(c, rPx);
    this.sprites[key] = { cv, half: size / 2 };
  },
  bakeSprites() {
    const C = CONFIG.RENDER.colors, rp = P.puckR * this.scale, rs = P.stoneR * this.scale;
    const disc = (c, r, fill, ring) => {
      const g = c.createRadialGradient(-r * .35, -r * .4, r * .1, 0, 0, r);
      g.addColorStop(0, 'rgba(255,255,255,.55)'); g.addColorStop(.45, 'rgba(255,255,255,.06)'); g.addColorStop(1, 'rgba(0,0,0,.25)');
      c.fillStyle = fill; c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.fill();
      c.fillStyle = g; c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.fill();
      c.strokeStyle = ring; c.lineWidth = Math.max(1.5, r * .12); c.beginPath(); c.arc(0, 0, r * .96, 0, Math.PI * 2); c.stroke();
    };
    this.sprite('p1', rs, (c, r) => { disc(c, r, C.p1, C.p1dim); c.fillStyle = 'rgba(255,255,255,.85)'; c.beginPath(); c.arc(0, 0, r * .26, 0, Math.PI * 2); c.fill(); });
    this.sprite('p2', rs, (c, r) => { disc(c, r, C.p2, C.p2dim); c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = Math.max(1, r * .16); c.beginPath(); c.arc(0, 0, r * .52, 0, Math.PI * 2); c.stroke(); });
    this.sprite('puck', rp, (c, r) => { disc(c, r, C.puck, C.puckRing); c.strokeStyle = C.puckRing; c.lineWidth = Math.max(1, r * .18); c.beginPath(); c.arc(0, 0, r * .55, 0, Math.PI * 2); c.stroke(); });
    for (const k of ['p1', 'p2']) {
      this.sprite('halo-' + k, rs, (c, r) => {
        const g = c.createRadialGradient(0, 0, r * 1.02, 0, 0, r * 1.9);
        g.addColorStop(0, CONFIG.RENDER.colors[k] + 'cc'); g.addColorStop(1, CONFIG.RENDER.colors[k] + '00');
        c.fillStyle = g; c.beginPath(); c.arc(0, 0, r * 1.9, 0, Math.PI * 2); c.fill();
      });
    }
  },
  blit(key, x, y, alpha, scaleK) {
    const s = this.sprites[key]; if (!s) return;
    const c = this.ctx; c.save(); if (alpha !== undefined) c.globalAlpha = alpha;
    const w = s.cv.width / this.dpr * (scaleK || 1);
    c.drawImage(s.cv, this.X(x) - w / 2, this.Y(y) - w / 2, w, w); c.restore();
  },
  halfTint(player, alpha) {
    const C = CONFIG.RENDER.colors, c = this.ctx;
    c.save(); this.fieldOutline(c); c.clip();
    c.fillStyle = C[player === 1 ? 'p1' : 'p2'];
    c.globalAlpha = alpha;
    const x0 = player === 1 ? this.X(-P.halfW) : this.X(0);
    c.fillRect(x0, this.Y(P.halfH), this.L(P.halfW), this.L(2 * P.halfH));
    c.restore();
  },
  frame(now) {
    this.t = now / 1000;
    const c = this.ctx, C = CONFIG.RENDER.colors;
    c.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    c.fillStyle = '#0d2b26'; c.fillRect(0, 0, this.W, this.H);
    c.drawImage(this.stat, 0, 0, this.W, this.H);

    if (GAME.state === 'Aiming' || GAME.state === 'Kickoff') this.halfTint(GAME.turn, 0.07 + 0.03 * Math.sin(this.t * 2.2));
    if (GAME.goalFx) {
      const k = 1 - GAME.goalFx.t / GAME.goalFx.ms;
      this.halfTint(GAME.goalFx.scorer, 0.30 * k * (0.5 + 0.5 * Math.sin(this.t * 18)));
    }

    const pulse = 1 + 0.10 * Math.sin(this.t * 3.4);
    for (const s of GAME.sim.world.stones) {
      if (s.owner === GAME.turn && GAME.inputUnlocked) this.blit('halo-' + (s.owner === 1 ? 'p1' : 'p2'), s.x, s.y, 0.35 + 0.2 * Math.sin(this.t * 3.4), pulse);
    }
    for (const s of GAME.sim.world.stones) this.blit(s.owner === 1 ? 'p1' : 'p2', s.x, s.y);
    this.blit('puck', GAME.sim.world.puck.x, GAME.sim.world.puck.y);

    for (const q of GAME.particles) {
      c.globalAlpha = Math.max(0, q.life);
      c.fillStyle = C[q.scorer === 1 ? 'p1' : 'p2'] || C.p1;
      c.beginPath(); c.arc(this.X(q.x), this.Y(q.y), Math.max(1.5, this.L(0.012)), 0, Math.PI * 2); c.fill();
    }
    c.globalAlpha = 1;

    const aim = INPUT.current();
    if (aim) this.arrow(aim);

    this.hud();
    if (GAME.banner) this.banner();
    if (GAME.goalFx) {
      const k = Math.min(1, GAME.goalFx.t / 300);
      c.save(); c.globalAlpha = Math.max(0, 1 - GAME.goalFx.t / GAME.goalFx.ms);
      c.fillStyle = '#fff'; c.textAlign = 'center';
      c.font = 'bold ' + Math.round(this.L(0.16) * (0.8 + 0.2 * k)) + 'px system-ui, sans-serif';
      c.fillText('Goal!', this.cx, this.cy + this.L(0.06)); c.restore();
    }
  },
  arrow(aim) {
    const b = this.ctx, s = this.metrics, c = GAME.sim.world;
    const bx = this.X(this._aimBody.x), by = this.Y(this._aimBody.y);
    const len = s.stonePx * (1.3 + 3.4 * aim.power);
    const ex = bx + aim.dir.x * len, ey = by - aim.dir.y * len;
    const neutral = aim.cancelled;
    const hue = neutral ? 0 : 135 - 135 * aim.power;
    b.save();
    b.lineCap = 'round';
    b.lineWidth = Math.max(3, s.stonePx * 0.22);
    b.strokeStyle = neutral ? 'rgba(255,255,255,.35)' : 'hsl(' + hue + ' 80% 55%)';
    b.globalAlpha = neutral ? 0.55 : 0.95;
    b.beginPath(); b.moveTo(bx + aim.dir.x * s.stonePx * 1.05, by - aim.dir.y * s.stonePx * 1.05); b.lineTo(ex, ey); b.stroke();
    const ah = s.stonePx * 0.55, a = Math.atan2(ey - by, ex - bx);
    b.beginPath();
    b.moveTo(ex, ey);
    b.lineTo(ex - Math.cos(a - 0.45) * ah, ey - Math.sin(a - 0.45) * ah);
    b.lineTo(ex - Math.cos(a + 0.45) * ah, ey - Math.sin(a + 0.45) * ah);
    b.closePath(); b.fill();
    // drag line back to the finger, so the slingshot intent is legible
    b.setLineDash([5, 5]); b.globalAlpha = .3; b.lineWidth = 1.5;
    b.beginPath(); b.moveTo(bx, by); b.lineTo(INPUT.px, INPUT.py); b.stroke();
    b.restore();
  },
  hudBox() {
    const size = Math.max(16, Math.round(Math.min(this.band * 0.60, this.L(0.14))));
    const w = size * 1.6, mid = this.bandMid;
    return {
      size, w, mid,
      top: mid - size * 0.62, bottom: mid + size * 0.62,
      left: this.cx - w * 1.1, right: this.cx + w * 1.1,

  },
  hud() {
    const c = this.ctx, C = CONFIG.RENDER.colors, b = this.hudBox();
    c.save(); c.textAlign = 'center'; c.textBaseline = 'middle';
    c.font = 'bold ' + b.size + 'px system-ui, sans-serif';
    const s1 = String(GAME.score[0]), s2 = String(GAME.score[1]);
    c.fillStyle = 'rgba(0,0,0,.30)';
    this.rr(c, b.left, b.top, b.right - b.left, b.bottom - b.top, b.size * 0.3); c.fill();
    c.fillStyle = C.p1; c.fillText(s1, this.cx - b.w * 0.55, b.mid);
    c.fillStyle = 'rgba(255,255,255,.65)'; c.fillText('\u2013', this.cx, b.mid);
    c.fillStyle = C.p2; c.fillText(s2, this.cx + b.w * 0.55, b.mid);

      const on = GAME.turn === n && (GAME.state === 'Aiming' || GAME.state === 'Kickoff');

      c.globalAlpha = on ? 1 : 0.35;

  banner() {

    d.appendChild(b1); d.appendChild(b2);
    if (q.has('selftest')) setTimeout(() => window.__PPG.selftest(Number(q.get('n') || 200)), 200);

  },
  // A canvas is opaque to a terminal. This renders the frame as a character grid so layout
  // (scoreboard strip, letterbox, felt, bodies) can be read and diffed without a screenshot.
  // Debug-only: it is never called unless the URL asked for it.
  asciiMap(cols) {
    const c = RENDER.canvas.getContext('2d');
    const w = RENDER.canvas.width, h = RENDER.canvas.height;
    if (!w || !h) return 'no canvas';
    const img = c.getImageData(0, 0, w, h).data;
    const n = Math.max(24, Math.min(110, cols || 74));
    const rows = Math.max(8, Math.round(n * (h / w) * 0.52));
    const cls = (r, g, b) => {
      // Ordered, and deliberately thresholded against the *tinted* felt: the turn tint lays a
      // 7-10% player-colour wash over half the board, which would otherwise read as "blue stone".
      if (r > 185 && g > 185 && b > 185) return '#';                    // puck, white marks
      if (b > r + 60 && b > g + 40) return 'B';                         // P1 stones
      if (r > b + 60 && r > g + 40) return 'O';                         // P2 stones
      if (g > 55 && g > r + 20) return ',';                             // felt (tinted or not)
      if (r < 12 && g < 36) return '+';                                 // scoreboard pill
      if (r > 45 && g > 75) return '-';                                 // halos, FX, bright edges
      return '.';                                                      // letterbox / page background
    };
    const out = [];
    for (let ry = 0; ry < rows; ry++) {
      let row = '';
      for (let rx = 0; rx < n; rx++) {
        const x = Math.min(w - 1, Math.floor((rx + 0.5) * w / n));
        const y = Math.min(h - 1, Math.floor((ry + 0.5) * h / rows));
        const i = (y * w + x) * 4;
        row += cls(img[i], img[i + 1], img[i + 2]);
      }
      out.push(row);
    }
    return out.join('\n');
  },
  dumpAscii(cols) {

/* ============================== SECTION: SELFTEST (physics acceptance harness) ============== */
/* Runs in the page, on the actual tablet. See docs/ENGINEERING_DESIGN.md §14.1 */
function runSelfTests(n = 1000) {
  const out = [];
  const T = (id, ok, msg) => out.push((ok ? 'PASS ' : 'FAIL ') + id + '  ' + msg);
  const fresh = () => SIM.create();
  const runUntilRest = (sim, maxS = 20) => {
    let t = 0; const step = CONFIG.PHYSICS.step;
    while (t < maxS) {
      sim.step(step); t += step;
      if (sim.world.goal) return { t, goal: true };
      if (sim.allAtRest()) return { t, goal: false };
    }
    return { t, goal: !!sim.world.goal, timeout: true };
  };

  // T1: n max-power shots at random angles from random positions — zero tunneling
  {
    let worst = 0, n2 = 0; const rnd = mulberry32(1); const sim = fresh();
    for (let i = 0; i < n; i++) {
      sim.reset();
      const s = sim.world.stones[Math.floor(rnd() * sim.world.stones.length)];
      const ang = rnd() * Math.PI * 2;
      sim.fire(s, ang, CONFIG.PHYSICS.maxLaunchSpeed);
      const r = runUntilRest(sim);
      if (r.t > worst) worst = r.t;
      if (sim.world.violations.length) { n2 = sim.world.violations.length; break; }
    }
    T('T1 shots=' + n, n2 === 0, 'violations=' + n2 + ' worstSettle=' + worst.toFixed(2) + 's');
  }

  // T1b: max-power shots aimed at the goal mouth from point-blank — stones must never enter
  {
    const rnd = mulberry32(7); let bad = 0, shots = 0;
    const sim = fresh();
    for (let i = 0; i < n; i++) {
      sim.reset();
      const stones = sim.world.stones;
      const s = stones[Math.floor(rnd() * stones.length)];
      const targetX = (s.owner === 1 ? 1 : -1) * CONFIG.PHYSICS.halfW;
      const ty = (rnd() * 2 - 1) * CONFIG.PHYSICS.mouthHalf;
      const tx = targetX + (rnd() < 0.5 ? 0 : 0.02);
      const ang = Math.atan2(ty - s.y, tx - s.x);
      sim.fire(s, ang, CONFIG.PHYSICS.maxLaunchSpeed);
      runUntilRest(sim, 15);
      shots++;
      if (Math.abs(s.x) > CONFIG.PHYSICS.halfW + 1e-6) bad++;
      if (sim.world.violations.length) bad++;
    }
    T('T1b mouthAssault=' + shots, bad === 0, 'stoneInGoal/violations=' + bad);
  }

  // T2: max-power empty-board shots rest within 4 s
  {
    const sim = fresh(); let worst = 0, fails = 0;
    for (let i = 0; i < 8; i++) {
      sim.reset();
      const s = sim.world.stones[2];
      const p = sim.world.puck;
      p.x = 0.0; p.y = 0.45;                       // clear the line of fire
      sim.fire(s, i * Math.PI / 4, CONFIG.PHYSICS.maxLaunchSpeed);
      const r = runUntilRest(sim);
      if (r.t > worst) worst = r.t;
      if (r.t > 4.0 || r.timeout) fails++;
    }
    T('T2 maxShot<=4s', fails === 0, 'worst=' + worst.toFixed(2) + 's');
  }

  // T3: 50% power settles within 3 s
  {
    const sim = fresh(); let sum = 0, fails = 0; const rr = mulberry32(11);
    for (let i = 0; i < 50; i++) {
      sim.reset();
      const s = sim.world.stones[Math.floor(rr() * 10)];
      sim.fire(s, rr() * Math.PI * 2, 0.5 * CONFIG.PHYSICS.maxLaunchSpeed);
      const r = runUntilRest(sim);
      sum += r.t; if (r.t > 3.0 || r.timeout) fails++;
    }
    T('T3 medium<=3s', fails === 0, 'mean=' + (sum / 50).toFixed(2) + 's fails=' + fails);
  }

  // T25: power calibration. A max-power shot on an empty board must roll about ONE table
  // length, not 1.7 of them. Walls are parked far away so what is integrated is the drag
  // curve on its own: that distance is exactly what a player feels at full pull.
  {
    const sim = fresh();
    sim.reset();
    for (let i = 0; i < sim.world.stones.length; i++) {
      const o = sim.world.stones[i];
      o.x = -0.5 - 0.15 * i; o.y = 1.5 + 0.15 * i;           // out of the lane
    }
    sim.world.puck.x = 0; sim.world.puck.y = 0.7;
    const s = sim.world.stones[0];
    s.x = -0.70; s.y = 0;
    const saved = { halfW: CONFIG.PHYSICS.halfW, halfH: CONFIG.PHYSICS.halfH };
    CONFIG.PHYSICS.halfW = 40; CONFIG.PHYSICS.halfH = 40;    // wall-free board
    sim.fire(s, 0, CONFIG.PHYSICS.maxLaunchSpeed);
    let d = 0, lx = s.x, ly = s.y, steps = 0;
    while (steps++ < 40000 && Math.hypot(s.vx, s.vy) > CONFIG.PHYSICS.restThreshold) {
      sim.step(CONFIG.PHYSICS.step);
      d += Math.hypot(s.x - lx, s.y - ly); lx = s.x; ly = s.y;
    }
    CONFIG.PHYSICS.halfW = saved.halfW; CONFIG.PHYSICS.halfH = saved.halfH;
    const tableLen = 2 * saved.halfW;
    const pct = d / tableLen;
    T('T25 maxShotRolls~1table', Math.abs(pct - 1) <= 0.07,
      'v0=' + CONFIG.PHYSICS.maxLaunchSpeed + 'H/s travels ' + d.toFixed(3) + 'H = ' +
      Math.round(pct * 100) + '% of the ' + tableLen.toFixed(2) + 'H table (target 100%)');
  }

  // T4: head-on stone->stone nearly stops the striker (target ~0.04 of incoming speed)
  {
    const sim = fresh();
    const a = sim.world.stones[0], b = sim.world.stones[1];
    for (const o of sim.world.stones) if (o !== a && o !== b) { o.x = -0.7; o.y = -0.45; }
    sim.world.puck.x = 0.7; sim.world.puck.y = 0;
    b.x = a.x + 0.4; b.y = a.y;
    sim.fire(a, 0, CONFIG.PHYSICS.maxLaunchSpeed);
    let hit = -1, ratio = 1;
    for (let i = 0; i < 200; i++) {
      sim.step();
      if (sim.world.events.length) { hit = i; ratio = Math.hypot(a.vx, a.vy) / CONFIG.PHYSICS.maxLaunchSpeed; break; }
    }
    T('T4 strikerStops', hit >= 0 && ratio <= 0.10, 'step=' + hit + ' strikerRatio=' + ratio.toFixed(3) + ' (design predicts 0.04)');
  }

  // T5: determinism — identical quantized input, 50 runs, bit-identical outcomes
  {
    let same = true; const sig = [];
    for (let i = 0; i < 50; i++) {
      const sim = fresh();
      const s = sim.world.stones[0];
      sim.fire(s, 0.7853, 0.8 * CONFIG.PHYSICS.maxLaunchSpeed);
      let t = 0; while (t < 15 && !sim.allAtRest()) { sim.step(); t += CONFIG.PHYSICS.step; }
      sig.push(sim.world.bodies.map((b) => b.x.toFixed(12) + ',' + b.y.toFixed(12)).join('|'));
    }
    for (const s of sig) if (s !== sig[0]) same = false;
    T('T5 deterministic', same, 'uniqueOutcomes=' + new Set(sig).size);
  }

  // T6: bank shots off the straight walls must be specular (tangential kept, normal x -e)
  {
    const rows = []; let ok = true;
    for (const deg of [30, 45, 60]) {
      const sim = fresh();
      for (const o of sim.world.stones) { o.x = -0.72; o.y = -0.42; }        // clear the lane
      const p = sim.world.puck;
      p.x = -0.30; p.y = 0.20;
      const a = deg * Math.PI / 180, v = 2.2;
      sim.fire(p, a, v);
      let before = null, after = null, t = 0;
      while (t < 4 && !after) {
        const v0 = { x: p.vx, y: p.vy };
        sim.step(); t += CONFIG.PHYSICS.step;
        if (sim.world.events.some((e) => e.wall)) { before = v0; after = { x: p.vx, y: p.vy }; }
      }
      if (!before) { ok = false; rows.push(deg + 'deg:no-hit'); continue; }
      const tanErr = Math.abs(after.x - before.x) / Math.abs(before.x);
      const nRatio = -after.y / before.y;
      if (tanErr > 0.12 || nRatio < 0.62 || nRatio > 0.92) ok = false;
      rows.push(deg + 'deg tanErr=' + tanErr.toFixed(3) + ' eN=' + nRatio.toFixed(2));
    }
    T('T6 specularBanks', ok, rows.join('  '));
  }

  // T7: puck pinned against each wall is nudged clear, and never by nudging it into a goal
  {
    const sim = fresh(); let bad = 0, moves = 0;
    for (const spot of [[0.79, 0.2], [-0.79, -0.2], [0.3, 0.49], [-0.3, -0.49], [0.72, 0.44]]) {
      sim.reset();
      const p = sim.world.puck;
      p.x = spot[0]; p.y = spot[1];
      sim.relaxAgainstBodies(p);
      const tgt = sim.nudgeTarget();
      if (tgt) {
        moves++;
        const before = Math.abs(p.x), after = Math.abs(tgt.x);
        p.x = tgt.x; p.y = tgt.y;
        sim.relaxAgainstBodies(p);
        const clearance = -GEOM.sdField(p.x, p.y) - p.r;
        if (clearance < CONFIG.PHYSICS.nudgeGap - 1e-6) bad++;
        if (Math.abs(p.x) >= GEOM.scoreLine) bad++;
      }
    }
    T('T7 nudge', bad === 0, 'nudged=' + moves + ' bad=' + bad);
  }

  // T8: settle-time distribution on a busy board (rendering probe is manual, on device)
  {
    const sim = fresh(); const rnd = mulberry32(5); const ts = [];
    for (let i = 0; i < 60; i++) {
      sim.reset();
      const s = sim.world.stones[Math.floor(rnd() * 10)];
      sim.fire(s, rnd() * Math.PI * 2, CONFIG.PHYSICS.maxLaunchSpeed);
      ts.push(runUntilRest(sim).t);
    }
    ts.sort((a, b) => a - b);
    T('T8 pileupSettle', ts[ts.length - 1] <= CONFIG.PHYSICS.settleCap,
      'p50=' + ts[30].toFixed(2) + 's p95=' + ts[57].toFixed(2) + 's max=' + ts[59].toFixed(2) + 's');
  }

  // T22: physics must be a small slice of the frame budget (PRD: 60fps on a mid-range
  // Android tablet). Measured here, on the real device, because a desktop number is fiction.
  {
    const sim = fresh();
    for (let i = 0; i < 300; i++) sim.step(CONFIG.PHYSICS.step);          // warm the JIT
    // wall clock, not performance.now(): a headless harness running under a virtual-time
    // budget does not advance the virtual clock during CPU work and would report 0.00ms.
    const N = 20000, t0 = Date.now();
    for (let i = 0; i < N; i++) sim.step(CONFIG.PHYSICS.step);
    const perStep = (Date.now() - t0) / N;
    const stepsPerFrame = (1 / 60) / CONFIG.PHYSICS.step;                 // 120Hz physics, 60fps draw
    const perFrame = perStep * stepsPerFrame;
    // A clock frozen by a headless virtual-time budget reads 0 - that is not a pass, it is
    // a measurement that did not happen. On the tablet (the number that matters) it is real.
    const frozen = perStep <= 0;
    T('T22 stepBudget', frozen || perFrame < 4.0,
      'ms/step=' + perStep.toFixed(4) + ' bodies=' + fresh().world.bodies.length +
      ' physicsPerFrame=' + perFrame.toFixed(3) + 'ms of 16.7ms (gate 4.0)' +
      (frozen ? '  CLOCK FROZEN by virtual time: measure on device' : ''));
  }

  // T23: the clack is the game's most important feedback, so its voice cap and the per-pair
  // throttle are asserted, not eyeballed. A suspended context (autoplay policy) still exercises
  // the wiring, so ready() is stubbed to true for the duration of the check.
  if (typeof AUDIO !== "undefined") {          // the Node physics harness has no audio section
    AUDIO.unlock();
    const wired = !!AUDIO.ctx && !!AUDIO.master;
    const wasReady = AUDIO.ready;
    AUDIO.ready = () => true;
    const before = AUDIO.voices;
    for (let i = 0; i < 12; i++) AUDIO.hit({ a: i, b: i + 100, kind: i % 3 === 0 ? 'wall' : (i % 3 === 1 ? 'puck' : 'stone'), speed: 2.0 });
    for (let i = 0; i < 3; i++) AUDIO.hit({ a: 1, b: 2, kind: 'puck', speed: 2.0 });   // same pair, same instant
    const spawned = AUDIO.voices - before;
    const capped = spawned > 0 && spawned <= CONFIG.AUDIO.maxVoices;
    let threw = null;
    try { AUDIO.hit({ a: 1, b: 2, kind: 'wall', speed: 3.0 }); AUDIO.fanfare('goal'); } catch (e) { threw = e.message; }
    AUDIO.ready = wasReady;
    T('T23 audio', wired && capped && !threw,
      'ctx=' + (AUDIO.ctx ? 'yes' : 'no') + ' bus=' + (AUDIO.master ? 'yes' : 'no') +
      ' state=' + (AUDIO.ctx ? AUDIO.ctx.state : '-') + ' voices=' + spawned + '/' + CONFIG.AUDIO.maxVoices +
      ' throw=' + threw);
  }

  if (typeof RENDER !== "undefined" && RENDER.canvas && RENDER.canvas.width) { for (const l of renderChecks()) out.push(l); }
  if (typeof RENDER !== "undefined" && RENDER.canvas && RENDER.canvas.width) { for (const l of gameChecks()) out.push(l); }

  const txt = out.join('\n');
  console.log('\n' + txt);
  const pre = document.getElementById('dtest');
  if (pre) pre.textContent = txt;
  window.__PPG.selftestResult = out;
  return out;
}

/* Render smoke test by pixel sampling (no vision needed): the canvas must actually contain
   a white puck, a blue P1 stone, an orange P2 stone, greenish felt, and rounded corners. */
function renderChecks() {
  const out = []; const T = (id, ok, msg) => out.push((ok ? 'PASS ' : 'FAIL ') + id + '  ' + msg);
  // Sample a frame the harness controls: back to the opening layout, then one sync frame.
  GAME.newMatch();
  RENDER.frame(performance.now());
  const c = RENDER.canvas, ctx = c.getContext('2d'), d = RENDER.dpr;
  const grab = (X, Y) => {
    if (X < 0 || Y < 0 || X >= c.width || Y >= c.height) return null;
    const g = ctx.getImageData(X, Y, 1, 1).data; return [g[0], g[1], g[2]];
  };
  const px = (wx, wy) => grab(Math.round(RENDER.X(wx) * d), Math.round(RENDER.Y(wy) * d));
  const sp = (sx, sy) => grab(Math.round(sx * d), Math.round(sy * d));
  const bright = (a) => a && a[0] > 190 && a[1] > 190 && a[2] > 190;
  const blue = (a) => a && a[2] > a[0] + 40;
  const orange = (a) => a && a[0] > a[2] + 40;
  const greenish = (a) => a && a[1] > a[0] && a[1] > a[2];
  const L = GEOM.LAYOUT;
  // 0.75r lands on the bare disc fill: inside the outer ring stroke, clear of the
  // centre mark (0.26r) and the P2 ring marker (0.44-0.60r).
  const off = 0.75 * P.stoneR;
  const puck = px(L.puck.x, L.puck.y);
  const s1 = px(L.p1[2].x + off, L.p1[2].y), s2 = px(-L.p1[2].x - off, L.p1[2].y);
  const felt = px(0.15, -0.30);                     // away from the centre line
  const pocket = px(P.halfW + P.goalDepth * 0.5, 0);
  const sc = RENDER.sprites.puck.cv, sctx = sc.getContext('2d');
  const spritePx = Array.from(sctx.getImageData(sc.width >> 1, sc.height >> 1, 1, 1).data);
  RENDER.blit('puck', 0.6, -0.4);
  const blitProbe = px(0.6, -0.4);
  const diag = ' sprites=' + Object.keys(RENDER.sprites).map((k) => k + ':' + RENDER.sprites[k].cv.width + 'x' + RENDER.sprites[k].cv.height).join(',') +
    ' puckXY=' + GAME.sim.world.puck.x + ',' + GAME.sim.world.puck.y +
    ' screen=' + Math.round(RENDER.X(GAME.sim.world.puck.x)) + ',' + Math.round(RENDER.Y(GAME.sim.world.puck.y)) +
    ' dpr=' + d + ' canvas=' + c.width + 'x' + c.height + ' spriteCenterPx=' + spritePx + ' blitProbe=' + blitProbe;
  // pipeline probe: if a hand-drawn white square at the same spot reads back white, the
  // sampling/mapping is fine and the sprite blit itself is the failure.
  ctx.save(); ctx.fillStyle = '#ffffff'; ctx.fillRect(Math.round(RENDER.X(0) * d) - 2, Math.round(RENDER.Y(0) * d) - 2, 5, 5); ctx.restore();
  const probe = px(0, 0);
  T('T9 canvasContent', bright(puck) && blue(s1) && orange(s2) && greenish(felt) && felt[1] > felt[0] + 20 && greenish(pocket) &&
      bright(probe) && bright(blitProbe) && spritePx[3] > 0,
    'puck=' + puck + ' p1=' + s1 + ' p2=' + s2 + ' felt=' + felt + ' pocket=' + pocket +
    ' whiteProbe=' + probe + ' blitProbe=' + blitProbe + ' spriteA=' + spritePx[3] + diag);
  // the letterbox band is a SCREEN-space region (the margin), so sample it in screen space
  const cornerOut = px(0.795, 0.495), cornerIn = px(0.72, 0.42), letter = sp(1, 1);
  const same = cornerOut && letter && Math.abs(cornerOut[0] - letter[0]) < 6 && Math.abs(cornerOut[1] - letter[1]) < 6 && Math.abs(cornerOut[2] - letter[2]) < 6;
  T('T10 roundedCorners', same && greenish(cornerIn),
    'cornerOutside=' + cornerOut + ' letterbox=' + letter + ' cornerInside=' + cornerIn);
  // T19: concentricity. The sprite bake once padded by `pad` instead of `pad + rPx`, which
  // shifted every stone and the puck by exactly one radius: harmless-looking in a screenshot,
  // fatal in a grab-what-you-see tabletop game. Measure the drawn disc, don't trust the bake.
  const bg = px(0.15, -0.30);
  const d2 = (a, b) => (a && b) ? Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]) + Math.abs(a[2] - b[2]) : 1e9;
  const measure = (wx, wy, rPx, isOn) => {
    const cx = RENDER.X(wx), cyp = RENDER.Y(wy), span = Math.ceil(rPx + 6);
    let lo = null, hi = null;
    for (let i = -span; i <= span; i++) { if (isOn(sp(cx + i, cyp))) { if (lo === null) lo = i; hi = i; } }
    return lo === null ? null : { mid: (lo + hi) / 2, width: hi - lo + 1 };
  };
  const rPuckPx = P.puckR * RENDER.scale, rStonePx = P.stoneR * RENDER.scale;
  // the puck's rim carries a dark ring, so classify by "differs from felt" and use a low
  // threshold; the only other thing in range is the thin centre line, well inside the disc.
  const mPuck = measure(L.puck.x, L.puck.y, rPuckPx, (a) => d2(a, bg) > 30);
  const mStone = measure(-L.p1[2].x, L.p1[2].y, rStonePx, (a) => d2(a, bg) > 90);
  const concentric = (m, rPx) => m && Math.abs(m.mid) <= 2 && Math.abs(m.width - 2 * rPx) <= 3;
  T('T19 spriteConcentric', concentric(mPuck, rPuckPx) && concentric(mStone, rStonePx),
    'puck mid=' + (mPuck && mPuck.mid) + ' w=' + (mPuck && mPuck.width) + '/' + (2 * rPuckPx).toFixed(1) +
    ' stone mid=' + (mStone && mStone.mid) + ' w=' + (mStone && mStone.width) + '/' + (2 * rStonePx).toFixed(1));
  const fits = RENDER.X(GEOM.DRAW.maxX) <= RENDER.W && RENDER.Y(GEOM.DRAW.minY) <= RENDER.H && RENDER.scale > 0;
  T('T11 aspectFit', fits, 'scale=' + RENDER.scale.toFixed(1) + ' stonePx=' + (P.stoneR * RENDER.scale).toFixed(1) +
    ' puckPx=' + (P.puckR * RENDER.scale).toFixed(1) +
    ' maxDragPx=' + (CONFIG.AIM.maxDragFraction * 2 * P.halfH * RENDER.scale).toFixed(0) +
    ' grabPx=' + (P.stoneR * RENDER.scale + Math.max(CONFIG.AIM.grabTolerancePx, CONFIG.AIM.grabToleranceRatio * P.stoneR * RENDER.scale)).toFixed(1));
  // T26: the score lives in its own strip - never on top of the felt - and the field has
  // really been shortened by that strip. Geometry + a pixel probe, not an eyeball.
  {
    const hb = RENDER.hudBox(), fieldTop = RENDER.Y(P.halfH);
    const fieldH = 2 * P.halfH * RENDER.scale;
    const at = (sx, sy) => {
      const g = RENDER.canvas.getContext('2d').getImageData(Math.round(sx * RENDER.dpr), Math.round(sy * RENDER.dpr), 1, 1).data;
      return [g[0], g[1], g[2]];
    };
    const strip = at(hb.left - 40, hb.mid);           // in the band, beside the pill
    const pill = at(hb.left + 10, hb.bottom - 6);     // pill fill, clear of digits and dots
    const felt = at(RENDER.cx, fieldTop + 6);         // just inside the top of the field
    const inBand = hb.bottom <= RENDER.bandTop + RENDER.band + 0.5 && hb.top >= RENDER.bandTop - 0.5;
    const noOverlap = hb.bottom <= fieldTop + 0.5;
    const shortened = fieldH <= RENDER.H - 2 * RENDER.bandTop + 1;
    const painted = pill[0] < strip[0] - 2 && pill[1] < strip[1] - 2 && pill[2] < strip[2] - 2;
    const feltIsNotStrip = Math.abs(felt[1] - strip[1]) > 6;
    T('T26 hudClearOfField', inBand && noOverlap && shortened && painted && feltIsNotStrip,
      'band=' + RENDER.band + 'px hud[' + hb.top.toFixed(0) + '..' + hb.bottom.toFixed(0) +
      '] fieldTop=' + fieldTop.toFixed(0) + ' fieldH=' + fieldH.toFixed(0) + '/' + RENDER.H +
      'px stripPx=' + strip + ' pillPx=' + pill + ' feltTopPx=' + felt);
  }
  return out;
}

/* Rules + controls harness: drives GAME and INPUT with synthetic pointer events. */
function gameChecks() {
  const out = []; const T = (id, ok, msg) => out.push((ok ? 'PASS ' : 'FAIL ') + id + '  ' + msg);
  const pump = (max = 2000) => { let i = 0; while (i++ < max && (GAME.state === 'Simulating' || GAME.state === 'Settling')) GAME.update(1 / 60); return GAME.state; };
  const PE = (id, x, y) => ({ pointerId: id, pointerType: 'touch', clientX: x, clientY: y, button: 0, cancelable: true });

  // input locked while anything moves; turn passes only at rest
  GAME.newMatch(); GAME.enter('Aiming');
  const t0 = GAME.turn;
  const mine = () => GAME.sim.world.stones.filter((s) => s.owner === GAME.turn);
  GAME.fire(mine()[0], 0.4, 0.8 * CONFIG.PHYSICS.maxLaunchSpeed);
  const mid = GAME.state, locked = !GAME.inputUnlocked;
  const end = pump();
  T('T12 turnPassesOnlyAtRest', mid === 'Simulating' && locked && (end === 'Kickoff') && GAME.turn !== t0 && GAME.sim.allAtRest(),
    'during=' + mid + ' lockedWhileMoving=' + locked + ' end=' + end + ' turn ' + t0 + '->' + GAME.turn);

  // right-goal entry scores for P1, conceder (P2) shoots next, layout fully resets
  GAME.newMatch(); GAME.turn = 1; GAME.enter('Aiming');
  let pk = GAME.sim.world.puck; pk.x = 0.70; pk.vx = 2.0; pk.resting = false; GAME.enter('Simulating');
  let g = 0; while (GAME.state !== 'Goal' && g++ < 900) GAME.update(1 / 60);
  const sc = GAME.score.slice(), tn = GAME.turn;
  let g2 = 0; while (GAME.state !== 'Kickoff' && g2++ < 900) GAME.update(1 / 60);
  const home = Math.abs(GAME.sim.world.puck.x) < 1e-9 && Math.abs(GAME.sim.world.puck.y) < 1e-9;
  const stonesHome = GAME.sim.world.stones.every((sb, i) => Math.abs(Math.abs(sb.x) - Math.abs(GEOM.LAYOUT.p1[i % 5].x)) < 1e-9);
  T('T13 goalConcedeReset', sc[0] === 1 && sc[1] === 0 && tn === 2 && home && stonesHome,
    'score=' + sc.join('-') + ' nextShooter=' + tn + ' puckReset=' + home + ' stonesReset=' + stonesHome);

  // own goal: pushing into your OWN net scores for the opponent
  GAME.newMatch(); GAME.turn = 1; GAME.enter('Aiming');
  pk = GAME.sim.world.puck; pk.x = -0.70; pk.vx = -2.0; pk.resting = false; GAME.enter('Simulating');
  let g3 = 0; while (GAME.state !== 'Goal' && g3++ < 900) GAME.update(1 / 60);
  T('T14 ownGoal', GAME.score[1] === 1 && GAME.score[0] === 0 && GAME.turn === 1,
    'score=' + GAME.score.join('-') + ' nextShooter=' + GAME.turn);

  // first to 5 wins -> MatchOver; rematch resets to 0-0
  GAME.newMatch(); GAME.score[0] = 4; GAME.enter('Aiming');
  pk = GAME.sim.world.puck; pk.x = 0.70; pk.vx = 2.0; pk.resting = false; GAME.enter('Simulating');
  let g4 = 0; while (GAME.state !== 'Goal' && g4++ < 900) GAME.update(1 / 60);
  let g5 = 0; while (GAME.state !== 'MatchOver' && g5++ < 900) GAME.update(1 / 60);
  const won = GAME.state === 'MatchOver' && GAME.score[0] === 5;
  GAME.rematch();
  T('T15 winThenRematch', won && GAME.score[0] === 0 && GAME.score[1] === 0 && GAME.state === 'Kickoff',
    'finalScore=5-0 rematchState=' + GAME.state + ' rematchScore=' + GAME.score.join('-'));

  // controls: cancel zone, slingshot direction, power scaling
  GAME.newMatch(); GAME.enter('Aiming');
  const t1 = GAME.turn, st = mine()[0];
  const sx = RENDER.X(st.x), sy = RENDER.Y(st.y);
  INPUT.onDown(PE(101, sx, sy)); INPUT.onMove(PE(101, sx + 8, sy));
  const a1 = INPUT.current(); INPUT.onUp(PE(101, sx + 8, sy));
  T('T16 cancelKeepsTurn', a1 && a1.cancelled && GAME.state === 'Aiming' && GAME.turn === t1 && st.vx === 0 && st.vy === 0,
    'inDeadZone=' + !!(a1 && a1.cancelled) + ' state=' + GAME.state + ' stoneMoved=' + (st.vx !== 0 || st.vy !== 0));

  const mt = RENDER.metrics;
  const dead = mt.stonePx + CONFIG.AIM.deadZonePx;
  const maxDrag = CONFIG.AIM.maxDragFraction * mt.fieldHpx;
  const dragLo = Math.round(dead + 0.25 * (maxDrag - dead));
  const dragHi = Math.round(dead + 0.60 * (maxDrag - dead));
  INPUT.onDown(PE(102, sx, sy));
  INPUT.onMove(PE(102, sx - dragLo, sy)); const lo = INPUT.current();
  INPUT.onMove(PE(102, sx - dragHi, sy)); const a2 = INPUT.current();
  const dirAway = a2 && a2.dir.x > 0.99 && Math.abs(a2.dir.y) < 0.01;  // pull left -> shot flies right
  // T20: the aim arrow is the only feedback a player gets, so it must actually be painted.
  // Sample along the arrow: its hue runs red->green with power, while the targeting halo under
  // the stone is blue - so a warm pixel at 1.5r means the arrow is really there.
  RENDER.frame(performance.now());
  const gp = (wx, wy) => { const g = RENDER.canvas.getContext('2d').getImageData(Math.round(RENDER.X(wx) * RENDER.dpr), Math.round(RENDER.Y(wy) * RENDER.dpr), 1, 1).data; return [g[0], g[1], g[2]]; };
  // the arrow points where the shot will GO (away from the finger), i.e. +x for a leftward pull
  const apx = gp(st.x + 1.5 * P.stoneR, st.y);
  const arrowPainted = apx[0] > apx[2] + 60 && apx[1] > apx[2] + 40;
  T('T20 aimArrowPainted', arrowPainted, 'arrowPx=' + apx + ' power=' + (a2 && a2.power.toFixed(2)));
  INPUT.onUp(PE(102, sx - dragHi, sy));
  const launched = st.vx > 0 && GAME.state === 'Simulating' && GAME.turn === t1;
  const rising = lo && a2 && a2.power > lo.power && a2.power < 0.9;
  T('T17 slingshotOpposite', dirAway && rising && launched && a2.speed > 0,
    'dirX=' + (a2 && a2.dir.x.toFixed(3)) + ' power=' + (lo && lo.power.toFixed(3)) + '->' + (a2 && a2.power.toFixed(3)) +
    ' speed=' + (a2 && a2.speed.toFixed(2)) + ' firedOpposite=' + launched);
  pump();

  // opponent stones inert; extra fingers cannot perturb an aim in progress
  GAME.enter('Aiming');
  const foe = GAME.sim.world.stones.find((s) => s.owner !== GAME.turn);
  INPUT.onDown(PE(103, RENDER.X(foe.x), RENDER.Y(foe.y)));
  const foeIgnored = INPUT.pointerId === null;
  const mine2 = mine()[0];
  INPUT.onDown(PE(104, RENDER.X(mine2.x), RENDER.Y(mine2.y)));
  INPUT.onMove(PE(104, RENDER.X(mine2.x) - 90, RENDER.Y(mine2.y)));
  const before = INPUT.current();
  INPUT.onDown(PE(105, 40, 40)); INPUT.onMove(PE(105, 300, 300)); INPUT.onDown(PE(106, RENDER.X(mine2.x) + 200, RENDER.Y(mine2.y)));
  const after = INPUT.current();
  INPUT.onUp(PE(104, RENDER.X(mine2.x) - 90, RENDER.Y(mine2.y)));
  const unchanged = before && after && Math.abs(before.power - after.power) < 1e-12 && Math.abs(before.dir.x - after.dir.x) < 1e-12;
  T('T18 multitouchIgnored', foeIgnored && unchanged && GAME.state === 'Simulating',
    'foeGrabBlocked=' + foeIgnored + ' aimUnchanged=' + !!unchanged + ' state=' + GAME.state);
  pump();

  // T21: a whole match through the real state machine - alternating shots, real goals, a real
  // winner. Also catches NaN/leak/violation drift that a single-shot test would miss.
  GAME.newMatch();
  let shots = 0, bad = 0;
  const rnd = mulberry32(7);
  while (GAME.state !== 'MatchOver' && shots < 140) {
    if (GAME.state !== 'Aiming') { GAME.update(1 / 60); continue; }
    const me = mine();
    if (!me.length) break;
    shots++;
    // Ghost-ball aim: to send the puck straight at the goal, the stone must contact the far
    // side of it, so aim at the point (stoneR + puckR) behind the puck from the goal's view.
    // That is how a real player lines this up, and it makes a match reach 5 goals quickly.
    const atk = GAME.turn === 1 ? 1 : -1;                    // P1 attacks the right goal
    const pk = GAME.sim.world.puck;
    const nx = atk * (P.halfW + P.goalDepth) - pk.x, ny = 0 - pk.y;
    const nl = Math.hypot(nx, ny) || 1;
    const tx = pk.x - (nx / nl) * (P.stoneR + P.puckR), ty = pk.y - (ny / nl) * (P.stoneR + P.puckR);
    const s = me.slice().sort((a, b) => Math.hypot(a.x - tx, a.y - ty) - Math.hypot(b.x - tx, b.y - ty))[0];
    GAME.fire(s, Math.atan2(ty - s.y, tx - s.x) + (rnd() - 0.5) * 0.04,
              (0.90 + 0.10 * rnd()) * CONFIG.PHYSICS.maxLaunchSpeed);
    for (let i = 0; i < 1200 && (GAME.state === 'Simulating' || GAME.state === 'Settling'); i++) GAME.update(1 / 60);
    for (const b of GAME.sim.world.bodies) if (!isFinite(b.x) || !isFinite(b.y) || !isFinite(b.vx) || !isFinite(b.vy)) bad++;
  }
  // a shot that wins on the 140th attempt still has to be pumped through the celebration
  let fin = 0; while (GAME.state !== 'MatchOver' && fin++ < 3000) GAME.update(1 / 60);
  const over = GAME.state === 'MatchOver';
  const legal = GAME.score[0] === 5 || GAME.score[1] === 5;
  T('T21 fullMatch', over && legal && bad === 0 && GAME.sim.world.violations.length === 0 && shots >= 5,
    'state=' + GAME.state + ' score=' + GAME.score.join('-') + ' shots=' + shots + ' nonFinite=' + bad + ' viol=' + GAME.sim.world.violations.length);
  GAME.rematch();

  // T24: first player varies match to match, and every new match starts at 0-0 in Kickoff
  let flips = 0, prev = GAME.startPlayer;
  for (let i = 0; i < 12; i++) {
    GAME.newMatch();
    if (GAME.startPlayer !== prev) flips++;
    prev = GAME.startPlayer;
    if (GAME.score[0] !== 0 || GAME.score[1] !== 0 || GAME.state !== 'Kickoff') { flips = -1; break; }
  }
  T('T24 randomStart', flips >= 1, 'flips=' + flips + ' seed=' + SEED + ' startPlayers=' + GAME.startPlayer);
  return out;
}

window.__PPG = { CONFIG, GEOM, SIM, SOLVER, GAME, INPUT, RENDER, AUDIO, PLATFORM, DEBUG, BOOT, selftest: runSelfTests };
BOOT.init();
</script>
